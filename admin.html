<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* -------- LOGIN SCREEN -------- */
  #loginPanel {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: #000;
    padding: 1.25rem;
    z-index: 10;
  }
  #loginPanel.visible { display: flex; }

  .login-box {
    width: 100%;
    max-width: 360px;
    background: rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--red);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
  }

  .login-body {
    padding: 2.25rem 2rem 1.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .login-logo {
    width: clamp(9rem, 25vw, 12rem);
    height: auto;
    margin-bottom: 1.75rem;
  }

  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .login-form input {
    width: 100%;
    padding: 0.85rem 1rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.95rem;
    text-align: center;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
  }
  .login-form input:focus { border-color: var(--red-dim); }
  .login-form input::placeholder { letter-spacing: 0.05em; color: #555; }

  .login-form button {
    padding: 0.85rem 1rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
    border-radius: 2px;
  }
  .login-form button:hover { opacity: 0.85; }
  .login-form button:disabled { opacity: 0.4; cursor: wait; }

  #loginStatus {
    margin-top: 0.5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #ff5555;
    text-align: center;
    min-height: 1rem;
  }

  .login-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-top: 1px solid #1a1a1a;
    background: rgba(5, 5, 5, 0.6);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #777;
    text-align: center;
  }

  .login-footer img {
    width: 1.1rem;
    height: 1.1rem;
    object-fit: contain;
    flex-shrink: 0;
  }

  /* -------- MAIN ADMIN PANEL -------- */
  #mainPanel { display: none; padding: 2rem 1.25rem 4rem; }
  #mainPanel.visible { display: block; }

  .wrap { max-width: 900px; margin: 0 auto; }

  .admin-box {
    width: 100%;
    background: rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--red);
    border-radius: 2px;
    padding: 1.75rem 1.75rem 1.5rem;
    margin-bottom: 1.5rem;
  }

  .admin-box h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    text-align: center;
    color: var(--white);
  }

  label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 0.3rem;
  }

  .admin-box input {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.9rem;
    margin-bottom: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
  }
  .admin-box input:focus { border-color: var(--red-dim); }
  .admin-box input:read-only { background: #161616; color: #888; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .admin-box button {
    padding: 0.75rem 1.5rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
    border-radius: 2px;
  }
  .admin-box button:hover { opacity: 0.85; }
  .admin-box button:disabled { opacity: 0.4; cursor: wait; }

  .admin-box button.ghost {
    background: transparent;
    color: var(--white);
    border-color: #444;
  }
  .admin-box button.ghost:hover { border-color: var(--red); color: var(--red); opacity: 1; }

  .admin-box button.danger {
    background: transparent;
    color: #ff5555;
    border-color: #552222;
  }
  .admin-box button.danger:hover { border-color: #ff5555; opacity: 1; }

  .status {
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid;
    border-radius: 2px;
  }
  .status.ok { border-color: #2a5a2a; color: #6fdd6f; background: rgba(40, 120, 40, 0.1); }
  .status.err { border-color: #5a2a2a; color: #ff7777; background: rgba(120, 40, 40, 0.1); }

  .track-row {
    display: grid;
    grid-template-columns: 3rem 1fr auto;
    gap: 1rem;
    align-items: center;
    padding: 0.75rem 0.9rem;
    border: 1px solid #1d1d1d;
    background: rgba(5, 5, 5, 0.85);
    margin-bottom: 0.4rem;
    border-radius: 2px;
  }
  .track-row .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--red);
    line-height: 1;
  }
  .track-row .info { min-width: 0; }
  .track-row .t {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-row .a {
    font-size: 0.7rem;
    color: #999;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-row .actions { display: flex; gap: 0.4rem; }
  .track-row button { padding: 0.4rem 0.8rem; font-size: 0.65rem; }

  #trackList { max-height: 600px; overflow-y: auto; padding-right: 4px; }

  .form-actions { display: flex; gap: 0.6rem; margin-top: 0.5rem; }

  .empty-msg {
    text-align: center;
    color: #888;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-size: 0.72rem;
    padding: 1rem 0;
  }

  .logout-row {
    display: flex;
    justify-content: center;
    margin-top: 0.5rem;
  }
  .logout-row button {
    padding: 0.75rem 2rem;
    background: transparent;
    border: 1px solid #444;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    border-radius: 2px;
  }
  .logout-row button:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 480px) {
    .login-body { padding: 1.75rem 1.25rem 1.25rem; }
    .login-footer { font-size: 0.55rem; }
    .admin-box { padding: 1.25rem 1rem; }
    .track-row { grid-template-columns: 2.5rem 1fr; gap: 0.6rem; }
    .track-row .actions { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>

<body>
  <!-- LOGIN SCREEN -->
  <div id="loginPanel">
    <div class="login-box">
      <div class="login-body">
        <img class="login-logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub">
        <div class="login-form">
          <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
          <button id="loginBtn">Unlock</button>
          <div id="loginStatus"></div>
        </div>
      </div>
      <div class="login-footer">
        <img src="https://i.ibb.co/G4h5rkbB/Untitled46-20260902042949.png" alt="">
        <span>&copy; 2026 PhonkHub &middot; Property Of &yen;GoyMafia&yen;&trade;</span>
      </div>
    </div>
  </div>

  <!-- MAIN PANEL -->
  <div id="mainPanel">
    <div class="wrap">
      <div id="statusBox"></div>

      <!-- Add / Edit Track Box -->
      <div class="admin-box">
        <h2 id="formHeading">Add New Track</h2>
        <div class="row">
          <div>
            <label for="f_id">ID (number)</label>
            <input type="number" id="f_id" placeholder="38">
          </div>
          <div>
            <label for="f_youtube">YouTube ID</label>
            <input type="text" id="f_youtube" placeholder="dQw4w9WgXcQ">
          </div>
        </div>
        <label for="f_title">Title</label>
        <input type="text" id="f_title" placeholder="Track title">
        <label for="f_artist">Artist</label>
        <input type="text" id="f_artist" placeholder="Artist name">
        <div class="form-actions">
          <button id="submitBtn">Add Track</button>
          <button class="ghost" id="cancelEditBtn" style="display: none;">Cancel Edit</button>
        </div>
      </div>

      <!-- All Tracks Box -->
      <div class="admin-box">
        <h2>All Tracks</h2>
        <div id="trackList"><div class="empty-msg">Loading…</div></div>
      </div>

      <div class="logout-row">
        <button id="logoutBtn">Log Out</button>
      </div>
    </div>
  </div>

<script>
  var password = sessionStorage.getItem('ph_admin_pw') || '';
  var editingId = null;

  var loginPanel = document.getElementById('loginPanel');
  var mainPanel = document.getElementById('mainPanel');
  var statusBox = document.getElementById('statusBox');
  var loginStatus = document.getElementById('loginStatus');
  var pwInput = document.getElementById('pw');

  function showStatus(msg, isErr) {
    statusBox.innerHTML = '<div class="status ' + (isErr ? 'err' : 'ok') + '">' + msg + '</div>';
    setTimeout(function () { statusBox.innerHTML = ''; }, 3500);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function api(action, track) {
    return fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, action: action, track: track }),
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || 'Error');
        return data;
      });
    });
  }

  function showMain() {
    loginPanel.classList.remove('visible');
    mainPanel.classList.add('visible');
    loadTracks();
  }

  function showLogin() {
    loginPanel.classList.add('visible');
    mainPanel.classList.remove('visible');
    pwInput.value = '';
    loginStatus.textContent = '';
    setTimeout(function () { pwInput.focus(); }, 50);
  }

  function loadTracks() {
    document.getElementById('trackList').innerHTML = '<div class="empty-msg">Loading…</div>';
    fetch('/api/tracks')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var tracks = data.tracks || [];
        if (!tracks.length) {
          document.getElementById('trackList').innerHTML = '<div class="empty-msg">No tracks.</div>';
          return;
        }
        document.getElementById('trackList').innerHTML = tracks.map(function (t) {
          return (
            '<div class="track-row">' +
              '<div class="num">' + t.id + '</div>' +
              '<div class="info">' +
                '<div class="t">' + esc(t.title) + '</div>' +
                '<div class="a">' + esc(t.artist) + '</div>' +
              '</div>' +
              '<div class="actions">' +
                '<button class="ghost" data-edit="' + t.id + '">Edit</button>' +
                '<button class="danger" data-del="' + t.id + '">Delete</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      })
      .catch(function () {
        document.getElementById('trackList').innerHTML = '<div class="empty-msg">Could not load.</div>';
      });
  }

  function clearForm() {
    document.getElementById('f_id').value = '';
    document.getElementById('f_id').readOnly = false;
    document.getElementById('f_youtube').value = '';
    document.getElementById('f_title').value = '';
    document.getElementById('f_artist').value = '';
    document.getElementById('formHeading').textContent = 'Add New Track';
    document.getElementById('submitBtn').textContent = 'Add Track';
    document.getElementById('cancelEditBtn').style.display = 'none';
    editingId = null;
  }

  function tryLogin() {
    var pw = pwInput.value.trim();
    if (!pw) { loginStatus.textContent = 'Enter a password'; return; }
    password = pw;
    loginStatus.textContent = '';
    document.getElementById('loginBtn').disabled = true;

    api('verify')
      .then(function () {
        sessionStorage.setItem('ph_admin_pw', password);
        showMain();
      })
      .catch(function () {
        password = '';
        loginStatus.textContent = 'Wrong password';
      })
      .finally(function () {
        document.getElementById('loginBtn').disabled = false;
      });
  }

  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin();
  });

  if (password) {
    api('verify')
      .then(function () { showMain(); })
      .catch(function () {
        sessionStorage.removeItem('ph_admin_pw');
        password = '';
        showLogin();
      });
  } else {
    showLogin();
  }

  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem('ph_admin_pw');
    password = '';
    clearForm();
    showLogin();
  });

  document.getElementById('submitBtn').addEventListener('click', function () {
    var track = {
      id: parseInt(document.getElementById('f_id').value, 10),
      youtube_id: document.getElementById('f_youtube').value.trim(),
      title: document.getElementById('f_title').value.trim(),
      artist: document.getElementById('f_artist').value.trim(),
    };

    if (!track.id || !track.youtube_id || !track.title || !track.artist) {
      showStatus('Fill in all fields', true);
      return;
    }

    var action = editingId ? 'edit' : 'add';
    var btn = this;
    btn.disabled = true;

    api(action, track)
      .then(function () {
        showStatus(action === 'edit' ? 'Track updated' : 'Track added', false);
        clearForm();
        loadTracks();
      })
      .catch(function (err) { showStatus(err.message, true); })
      .finally(function () { btn.disabled = false; });
  });

  document.getElementById('cancelEditBtn').addEventListener('click', clearForm);

  document.getElementById('trackList').addEventListener('click', function (e) {
    var editBtn = e.target.closest('[data-edit]');
    var delBtn = e.target.closest('[data-del]');

    if (editBtn) {
      var id = parseInt(editBtn.getAttribute('data-edit'), 10);
      fetch('/api/tracks?id=' + id)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var t = data.track;
          document.getElementById('f_id').value = t.id;
          document.getElementById('f_id').readOnly = true;
          document.getElementById('f_youtube').value = t.youtube_id;
          document.getElementById('f_title').value = t.title;
          document.getElementById('f_artist').value = t.artist;
          document.getElementById('formHeading').textContent = 'Edit Track #' + t.id;
          document.getElementById('submitBtn').textContent = 'Save Changes';
          document.getElementById('cancelEditBtn').style.display = 'inline-block';
          editingId = t.id;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    if (delBtn) {
      var delId = parseInt(delBtn.getAttribute('data-del'), 10);
      if (!confirm('Delete track #' + delId + '? This cannot be undone.')) return;
      api('delete', { id: delId })
        .then(function () {
          showStatus('Track deleted', false);
          loadTracks();
        })
        .catch(function (err) { showStatus(err.message, true); });
    }
  });
</script>

</body>
</html>
