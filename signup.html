<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  .box {
    width: 100%;
    max-width: 380px;
    background: rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--red);
    border-radius: 2px;
    padding: 2.25rem 2rem 2rem;
  }

  .logo {
    display: block;
    width: clamp(9rem, 25vw, 12rem);
    height: auto;
    margin: 0 auto 1.5rem;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 1.5rem;
    color: var(--white);
  }

  label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 0.3rem;
  }

  label .optional {
    color: #555;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: none;
  }

  input {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.9rem;
    margin-bottom: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
  }
  input:focus { border-color: var(--red-dim); }
  input::placeholder { color: #555; }

  button {
    width: 100%;
    padding: 0.85rem 1rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
    border-radius: 2px;
    margin-top: 0.25rem;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: wait; }

  .msg {
    margin-top: 0.85rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    min-height: 1rem;
  }
  .msg.err { color: #ff5555; }
  .msg.ok { color: #6fdd6f; }

  .alt {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid #1a1a1a;
    text-align: center;
    font-size: 0.8rem;
    color: #888;
  }
  .alt a {
    color: var(--red);
    text-decoration: none;
    font-weight: 600;
  }
  .alt a:hover { text-decoration: underline; }
</style>
</head>

<body>
  <div class="box">
    <img class="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub">
    <h1>Create Account</h1>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="3-20 chars, letters/numbers/underscores" autocomplete="username" autocapitalize="none" spellcheck="false">

    <label for="display_name">Display Name <span class="optional">(optional)</span></label>
    <input type="text" id="display_name" placeholder="What shows on your profile" autocomplete="name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">

    <button id="submitBtn">Sign Up</button>
    <div class="msg" id="msg"></div>

    <div class="alt">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>

<script>
  var msgEl = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');

  function setMsg(text, isErr) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (isErr ? 'err' : 'ok');
  }

  document.getElementById('username').addEventListener('input', function () {
    this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
  });

  async function submit() {
    var username = document.getElementById('username').value.trim();
    var display_name = document.getElementById('display_name').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !email || !password) {
      setMsg('Fill in all required fields', true);
      return;
    }
    if (username.length < 3 || username.length > 20) {
      setMsg('Username must be 3-20 characters', true);
      return;
    }
    if (password.length < 8) {
      setMsg('Password must be at least 8 characters', true);
      return;
    }

    btn.disabled = true;
    setMsg('Creating account…', false);

    try {
      var res = await fetch('/api/auth?action=signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          email: email,
          password: password,
          display_name: display_name || null,
        }),
      });
      var data = await res.json();

      if (!res.ok) {
        setMsg(data.error || 'Something went wrong', true);
        btn.disabled = false;
        return;
      }

      setMsg('Welcome, ' + (data.user.display_name || data.user.username) + '!', false);
      window.location.href = '/';
    } catch (err) {
      setMsg('Network error', true);
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', submit);
  document.querySelectorAll('input').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submit();
    });
  });
</script>
</body>
</html>
