<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forums — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
    --sidebar-width: 220px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-lockup { display: inline-flex; align-items: center; justify-self: start; }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .brand-group {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    justify-self: start;
  }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.15rem;
    height: 2.15rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.35), rgba(64, 78, 237, 0.35));
    border: 1px solid rgba(88, 101, 242, 0.35);
    color: #fff;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .discord-btn:hover {
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(64, 78, 237, 0.5));
    transform: translateY(-1px);
  }
  .discord-btn svg {
    width: 1.25rem;
    height: 1.25rem;
    display: block;
  }

  .search-box {
    display: flex;
    align-items: center;
    min-width: 0;
    max-width: 32rem;
    height: 2.35rem;
    padding: 0 0.8rem;
    border: 1px solid #303030;
    border-radius: 999px;
    background: #191919;
    color: #aaa;
    justify-self: center;
    width: 100%;
    pointer-events: none;
  }
  .search-box svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
  .search-box input {
    width: 100%;
    border: 0;
    outline: 0;
    padding: 0 0.6rem;
    background: transparent;
    color: var(--white);
    font: inherit;
    pointer-events: none;
  }
  .search-box input::placeholder { color: #858585; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent { background: var(--red); border-color: var(--red); color: #080808; }

  .primary-nav { border-top: 1px solid #181818; }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 3rem);
    overflow-x: auto;
    padding: 0 1.25rem;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }
  .nav-link {
    position: relative;
    flex: 0 0 auto;
    padding: 0.75rem 0.1rem 0.68rem;
    color: #d4d4d4;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--red); }
  .nav-link.active::after {
    content: '';
    position: absolute;
    right: 0; bottom: 0; left: 0;
    height: 2px;
    background: var(--red);
  }

  .forum-shell {
    display: flex;
    max-width: 1320px;
    margin: 0 auto;
    min-height: calc(100vh - 130px);
  }

  .forum-sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: #050505;
    border-right: 1px solid #1a1a1a;
    padding: 1.5rem 1rem;
  }

  .sidebar-group { margin-bottom: 1.5rem; }
  .sidebar-group-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #666;
    padding: 0 0.75rem 0.5rem;
    margin-bottom: 0.25rem;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.75rem;
    color: #bbb;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    border-left: 2px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .sidebar-item:hover { color: var(--white); background: rgba(255, 153, 0, 0.05); }
  .sidebar-item.active {
    color: var(--red);
    background: rgba(255, 153, 0, 0.08);
    border-left-color: var(--red);
  }

  .sidebar-item-count {
    margin-left: auto;
    font-size: 0.6rem;
    color: #666;
    background: #1a1a1a;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }
  .sidebar-item.active .sidebar-item-count {
    background: rgba(255, 153, 0, 0.15);
    color: var(--red);
  }

  .forum-main {
    flex: 1;
    padding: 2rem 2rem 4rem;
    min-width: 0;
  }

  .forum-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .forum-header-left { min-width: 0; }

  .breadcrumb {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 0.5rem;
  }
  .breadcrumb a { color: var(--red); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb-sep { color: #333; margin: 0 0.5rem; }

  .forum-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .forum-desc {
    color: #888;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .new-thread-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1.2rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .new-thread-btn:hover { opacity: 0.85; }

  .thread-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .thread-row {
    position: relative;
    padding: 1rem 1.15rem;
    background: rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-left: 3px solid var(--red-dim);
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
  }
  .thread-row:hover {
    background: rgba(20, 20, 20, 0.95);
    border-left-color: var(--red);
  }

  .thread-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    text-decoration: none;
  }

  .thread-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 0.35rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }
  .thread-row:hover .thread-title { color: var(--red); }

  .thread-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #777;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }

  .thread-author {
    color: var(--red);
    text-decoration: none;
    font-weight: 700;
    pointer-events: auto;
    position: relative;
    z-index: 3;
  }
  .thread-author:hover { text-decoration: underline; }

  .thread-meta-stat { color: #666; }
  .thread-meta-stat strong { color: var(--red); font-weight: 700; }

  .empty-state {
    padding: 4rem 2rem;
    text-align: center;
    border: 1px dashed #1d1d1d;
    border-radius: 2px;
  }
  .empty-state-icon { font-size: 2rem; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state-msg {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 1.5rem;
  }

  .loading-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  footer {
    background: #000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

  @media (max-width: 780px) {
    .header-main { grid-template-columns: auto 1fr auto; gap: 0.7rem; }
    .search-box {
      grid-column: 1 / -1;
      grid-row: 2;
      max-width: none;
      justify-self: stretch;
    }
    .action-chip { padding: 0.35rem 0.55rem; font-size: 0.62rem; }

    .forum-shell { flex-direction: column; }
    .forum-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #1a1a1a;
      padding: 1rem;
    }
    .sidebar-group { margin-bottom: 1rem; }
    .forum-main { padding: 1.5rem 1rem 3rem; }
  }
</style>
</head>

<body>
  <header>
    <div class="header-main">
      <div class="brand-group">
        <a class="brand-lockup" href="/" aria-label="PhonkHub home">
          <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
        </a>
        <a class="discord-btn" href="https://discord.gg/b7gQNCpjy4" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord" title="Join our Discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
        </a>
      </div>
      <label class="search-box" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input type="search" placeholder="Search PhonkHub" aria-label="Search tracks" readonly onfocus="this.blur()" />
      </label>
      <div class="header-actions" id="headerActions"></div>
    </div>

    <nav class="primary-nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link active" href="/forums">Forums</a>
        <a class="nav-link">About</a>
        <a class="nav-link">All Tracks</a>
        <a class="nav-link">Genres</a>
      </div>
    </nav>
  </header>

  <div class="forum-shell">
    <aside class="forum-sidebar" id="forumSidebar">
      <div class="loading-msg" style="padding:1rem 0;">Loading…</div>
    </aside>

    <main class="forum-main">
      <div id="forumContent">
        <div class="loading-msg">Loading threads…</div>
      </div>
    </main>
  </div>

  <footer>
    <p>
      <span class="tagline">New Tracks Added Periodically</span><br />&nbsp;<br />
      &copy; 2026 PhonkHub &nbsp;·&nbsp; Property Of ¥GoyMafia¥&trade; &nbsp;·&nbsp; All Rights To The Respective Artists
    </p>
  </footer>

<script>
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    var then = new Date(iso).getTime();
    var now = Date.now();
    var sec = Math.floor((now - then) / 1000);
    if (sec < 5) return 'just now';
    if (sec < 60) return sec + 's ago';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    var day = Math.floor(hr / 24);
    if (day < 30) return day + 'd ago';
    var mon = Math.floor(day / 30);
    if (mon < 12) return mon + 'mo ago';
    return Math.floor(mon / 12) + 'y ago';
  }

  function getSlugFromPath() {
    var match = window.location.pathname.match(/^\/forums\/([a-z0-9-]+)/i);
    return match ? match[1] : null;
  }

  var currentSlug = getSlugFromPath();
  var currentUser = null;

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;
    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();
      currentUser = data.user;

      if (data.user) {
        var userChip = document.createElement('a');
        userChip.className = 'action-chip';
        userChip.href = '/@' + data.user.username;
        userChip.textContent = data.user.display_name || data.user.username;

        var logoutBtn = document.createElement('a');
        logoutBtn.className = 'action-chip accent';
        logoutBtn.href = '#';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          await fetch('/api/auth?action=logout', { method: 'POST' });
          window.location.href = '/';
        });

        actions.appendChild(userChip);
        actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a');
        loginLink.className = 'action-chip';
        loginLink.href = '/login';
        loginLink.textContent = 'Log In';

        var signupLink = document.createElement('a');
        signupLink.className = 'action-chip accent';
        signupLink.href = '/signup';
        signupLink.textContent = 'Sign Up';

        actions.appendChild(loginLink);
        actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  (async function () {
    var sidebarEl = document.getElementById('forumSidebar');
    var contentEl = document.getElementById('forumContent');

    if (!currentSlug) {
      contentEl.innerHTML = '<div class="loading-msg">Invalid category URL</div>';
      return;
    }

    try {
      var catRes = await fetch('/api/forums?action=categories');
      var catData = await catRes.json();
      var categories = catData.categories || [];

      var threadRes = await fetch('/api/forums?action=threads&category=' + encodeURIComponent(currentSlug));
      if (!threadRes.ok) {
        contentEl.innerHTML = '<div class="loading-msg">Category not found</div>';
        sidebarEl.innerHTML = '';
        return;
      }
      var data = await threadRes.json();
      var category = data.category;
      var threads = data.threads || [];

      document.title = category.name + ' — PhonkHub Forums';

      var moderation = categories.filter(function (c) { return c.group_name === 'moderation'; });
      var discussion = categories.filter(function (c) { return c.group_name === 'discussion'; });

      function sidebarGroupHtml(title, cats) {
        return (
          '<div class="sidebar-group">' +
            '<div class="sidebar-group-title">' + title + '</div>' +
            cats.map(function (c) {
              var active = c.slug === currentSlug ? ' active' : '';
              return (
                '<a class="sidebar-item' + active + '" href="/forums/' + esc(c.slug) + '">' +
                  esc(c.name) +
                  (c.thread_count > 0 ? '<span class="sidebar-item-count">' + c.thread_count + '</span>' : '') +
                '</a>'
              );
            }).join('') +
          '</div>'
        );
      }

      sidebarEl.innerHTML =
        sidebarGroupHtml('Moderation', moderation) +
        sidebarGroupHtml('Discussion', discussion);

      var newThreadBtnHtml = '';
      var canPost = currentUser && (!category.admin_only || currentUser.is_admin);
      if (canPost) {
        newThreadBtnHtml = '<a class="new-thread-btn" href="/forums/new?sub=' + esc(category.slug) + '">+ New Thread</a>';
      } else if (!currentUser && !category.admin_only) {
        newThreadBtnHtml = '<a class="new-thread-btn" href="/login">Log In to Post</a>';
      }

      var threadsHtml;
      if (threads.length === 0) {
        threadsHtml =
          '<div class="empty-state">' +
            '<div class="empty-state-icon">💬</div>' +
            '<div class="empty-state-msg">No threads yet</div>' +
            (canPost ? '<a class="new-thread-btn" href="/forums/new?sub=' + esc(category.slug) + '">Start the First Thread</a>' : '') +
          '</div>';
      } else {
        threadsHtml =
          '<div class="thread-list">' +
          threads.map(function (t) {
            var displayName = t.display_name || t.username;
            return (
              '<div class="thread-row">' +
                '<a class="thread-overlay" href="/forums/thread-' + t.id + '" aria-label="' + esc(t.title) + '"></a>' +
                '<div class="thread-title">' + esc(t.title) + '</div>' +
                '<div class="thread-meta">' +
                  '<span>by <a class="thread-author" href="/@' + esc(t.username) + '">' + esc(displayName) + '</a></span>' +
                  '<span>' + timeAgo(t.created_at) + '</span>' +
                  '<span class="thread-meta-stat"><strong>' + (t.score > 0 ? '+' : '') + t.score + '</strong> score</span>' +
                  '<span class="thread-meta-stat"><strong>' + t.reply_count + '</strong> repl' + (t.reply_count === 1 ? 'y' : 'ies') + '</span>' +
                '</div>' +
              '</div>'
            );
          }).join('') +
          '</div>';
      }

      contentEl.innerHTML =
        '<div class="forum-header">' +
          '<div class="forum-header-left">' +
            '<div class="breadcrumb">' +
              '<a href="/forums">Forums</a>' +
              '<span class="breadcrumb-sep">/</span>' +
              esc(category.name) +
            '</div>' +
            '<div class="forum-title">' + esc(category.name) + '</div>' +
            '<div class="forum-desc">' + esc(category.description || '') + '</div>' +
          '</div>' +
          newThreadBtnHtml +
        '</div>' +
        threadsHtml;
    } catch (err) {
      contentEl.innerHTML = '<div class="loading-msg">Could not load threads</div>';
      sidebarEl.innerHTML = '';
    }
  })();
</script>
</body>
</html>
