<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forums — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
    --sidebar-width: 220px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-group {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    justify-self: start;
  }

  .brand-lockup { display: inline-flex; align-items: center; }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.15rem;
    height: 2.15rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.35), rgba(64, 78, 237, 0.35));
    border: 1px solid rgba(88, 101, 242, 0.35);
    color: #fff;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .discord-btn:hover {
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(64, 78, 237, 0.5));
    transform: translateY(-1px);
  }
  .discord-btn svg { width: 1.25rem; height: 1.25rem; display: block; }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .search-box {
    display: flex;
    align-items: center;
    min-width: 0;
    max-width: 32rem;
    height: 2.35rem;
    padding: 0 0.8rem;
    border: 1px solid #303030;
    border-radius: 999px;
    background: #191919;
    color: #aaa;
    justify-self: center;
    width: 100%;
    pointer-events: none;
  }
  .search-box svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
  .search-box input {
    width: 100%;
    border: 0;
    outline: 0;
    padding: 0 0.6rem;
    background: transparent;
    color: var(--white);
    font: inherit;
    pointer-events: none;
  }
  .search-box input::placeholder { color: #858585; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent { background: var(--red); border-color: var(--red); color: #080808; }

  .primary-nav { border-top: 1px solid #181818; }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 3rem);
    overflow-x: auto;
    padding: 0 1.25rem;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }
  .nav-link {
    position: relative;
    flex: 0 0 auto;
    padding: 0.75rem 0.1rem 0.68rem;
    color: #d4d4d4;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--red); }
  .nav-link.active::after {
    content: '';
    position: absolute;
    right: 0; bottom: 0; left: 0;
    height: 2px;
    background: var(--red);
  }

  .forum-shell {
    display: flex;
    max-width: 1320px;
    margin: 0 auto;
    min-height: calc(100vh - 130px);
  }

  .forum-sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: #050505;
    border-right: 1px solid #1a1a1a;
    padding: 1.5rem 1rem;
  }

  .sidebar-group { margin-bottom: 1.5rem; }
  .sidebar-group-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #666;
    padding: 0 0.75rem 0.5rem;
    margin-bottom: 0.25rem;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.75rem;
    color: #bbb;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    border-left: 2px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .sidebar-item:hover { color: var(--white); background: rgba(255, 153, 0, 0.05); }
  .sidebar-item.active {
    color: var(--red);
    background: rgba(255, 153, 0, 0.08);
    border-left-color: var(--red);
  }

  .sidebar-item-count {
    margin-left: auto;
    font-size: 0.6rem;
    color: #666;
    background: #1a1a1a;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }
  .sidebar-item.active .sidebar-item-count {
    background: rgba(255, 153, 0, 0.15);
    color: var(--red);
  }

  .forum-main {
    flex: 1;
    padding: 2rem 2rem 4rem;
    min-width: 0;
  }

  .forum-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .forum-header-left { min-width: 0; }

  .breadcrumb {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 0.5rem;
  }
  .breadcrumb a { color: var(--red); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb-sep { color: #333; margin: 0 0.5rem; }

  .forum-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .forum-desc {
    color: #888;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .new-thread-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1.2rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .new-thread-btn:hover { opacity: 0.85; }

  .thread-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .thread-row {
    position: relative;
    padding: 1rem 1.15rem;
    background: rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-left: 3px solid var(--red-dim);
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
  }
  .thread-row:hover {
    background: rgba(20, 20, 20, 0.95);
    border-left-color: var(--red);
  }

  .thread-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    text-decoration: none;
  }

  .thread-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 0.35rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }
  .thread-row:hover .thread-title { color: var(--red); }

  .thread-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #777;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }

  .thread-author {
    color: var(--red);
    text-decoration: none;
    font-weight: 700;
    pointer-events: auto;
    position: relative;
    z-index: 3;
  }
  .thread-author:hover { text-decoration: underline; }

  .thread-meta-stat { color: #666; }
  .thread-meta-stat strong { color: var(--red); font-weight: 700; }

  .empty-state {
    padding: 4rem 2rem;
    text-align: center;
    border: 1px dashed #1d1d1d;
    border-radius: 2px;
  }
  .empty-state-icon { font-size: 2rem; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state-msg {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 1.5rem;
  }

  .loading-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  footer {
    background: #000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

    /* VIP Booster Glow for Forums */
  .vip-glow {
    border: 1px solid rgba(255, 90, 0, 0.6) !important;
    box-shadow: 0 0 15px rgba(255, 90, 0, 0.15), inset 0 0 10px rgba(255, 90, 0, 0.05) !important;
    background: linear-gradient(135deg, rgba(255, 90, 0, 0.08), transparent 60%), rgba(13, 13, 13, 0.95) !important;
  }

  /* NOTIFICATION CSS */
  .notif-wrapper { position: relative; display: inline-block; }
  .notif-btn { background: transparent; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0.4rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s; position: relative; }
  .notif-btn:hover { color: var(--white); }
  .notif-badge { position: absolute; top: 0; right: 0; background: var(--red); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; font-weight: 700; padding: 0.1rem 0.3rem; border-radius: 999px; transform: translate(25%, -25%); display: none; }
  .notif-badge.show { display: block; }
  .notif-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 320px; background: #0d0d0d; border: 1px solid #2a2a2a; border-top: 3px solid var(--red); border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 1000; max-height: 400px; overflow-y: auto; }
  .notif-dropdown.open { display: block; }
  .notif-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a1a; background: #050505; }
  .notif-header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); }
  .notif-mark-read { background: none; border: none; color: var(--red); font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; letter-spacing: 0.05em; cursor: pointer; }
  .notif-mark-read:hover { text-decoration: underline; }
  .notif-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #1a1a1a; text-decoration: none; transition: background 0.15s; }
  .notif-item:hover { background: #1a1a1a; }
  .notif-item.unread { background: rgba(255, 153, 0, 0.05); }
  .notif-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1a1a1a; color: #888; flex-shrink: 0; font-size: 0.8rem; }
  .notif-item.unread .notif-icon { background: var(--red); color: #000; }
  .notif-text { font-family: 'Barlow', sans-serif; font-size: 0.85rem; color: #ddd; line-height: 1.4; }
  .notif-text strong { color: var(--white); font-weight: 600; }
  .notif-time { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; color: #666; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .notif-empty { padding: 2rem 1rem; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }

 @media (max-width: 780px) {
    /* Header Layout Fix */
    .header-main { 
      grid-template-columns: 1fr auto; 
      gap: 0.5rem; 
      padding: 0.65rem 0.75rem;
    }
    .brand-group { grid-column: 1; grid-row: 1; }
    .header-actions { grid-column: 2; grid-row: 1; justify-self: end; gap: 0.35rem; }
    
    /* Force the search bar to drop to row 2 and span full width */
    .search-box { 
      grid-column: 1 / -1; 
      grid-row: 2; 
      max-width: none; 
      justify-self: stretch; 
      margin-top: 0.25rem;
    }
    
    .action-chip { padding: 0.35rem 0.55rem; font-size: 0.62rem; }

    /* Mobile Notification Dropdown Fix */
    .notif-dropdown {
      position: fixed;
      top: 60px; 
      left: 10px;
      right: 10px;
      width: auto;
      max-width: none;
    }

    .forum-shell { flex-direction: column; }
    .forum-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #1a1a1a; padding: 1rem; }
    .sidebar-group { margin-bottom: 1rem; }
    .forum-main { padding: 1.5rem 1rem 3rem; }
  }
</style>
</head>

<script>
  // ---- Notification System ----
  (async function () {
    var actionsEl = document.getElementById('headerActions');
    if (!actionsEl) return;
    try {
      var authRes = await fetch('/api/auth?action=me');
      var authData = await authRes.json();
      if (!authData.user) return;
      var wrapper = document.createElement('div');
      wrapper.className = 'notif-wrapper';
      wrapper.innerHTML = `
        <button class="notif-btn" id="notifBtn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-header">
            <span class="notif-header-title">Notifications</span>
            <button class="notif-mark-read" id="markReadBtn">Mark all as read</button>
          </div>
          <div id="notifList"></div>
        </div>
      `;
      actionsEl.insertBefore(wrapper, actionsEl.firstChild);
      var btn = document.getElementById('notifBtn');
      var dropdown = document.getElementById('notifDropdown');
      var badge = document.getElementById('notifBadge');
      var list = document.getElementById('notifList');
      var markReadBtn = document.getElementById('markReadBtn');
      btn.addEventListener('click', function (e) { e.stopPropagation(); dropdown.classList.toggle('open'); });
      document.addEventListener('click', function (e) { if (!wrapper.contains(e.target)) dropdown.classList.remove('open'); });
      async function loadNotifications() {
        try {
          var res = await fetch('/api/notifications');
          if (!res.ok) return;
          var data = await res.json();
          if (data.unreadCount > 0) { badge.textContent = data.unreadCount > 9 ? '9+' : data.unreadCount; badge.classList.add('show'); } else { badge.classList.remove('show'); }
          if (data.notifications.length === 0) { list.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }
          var icons = { follow: '👤', reply: '💬', mention: '@' };
          list.innerHTML = data.notifications.map(function(n) {
            var isUnread = !n.is_read;
            var actorName = n.actor_display_name || n.actor_username;
            var text = n.type === 'follow' ? '<strong>' + actorName + '</strong> followed you' : n.type === 'reply' ? '<strong>' + actorName + '</strong> replied to your comment' : '<strong>' + actorName + '</strong> mentioned you';
            var mins = Math.floor((Date.now() - new Date(n.created_at).getTime()) / 60000);
            var timeStr = mins < 60 ? mins + 'm ago' : Math.floor(mins/60) + 'h ago';
            return `<a href="${n.link}" class="notif-item ${isUnread ? 'unread' : ''}"><div class="notif-icon">${icons[n.type] || '🔔'}</div><div class="notif-text">${text}<span class="notif-time">${timeStr}</span></div></a>`;
          }).join('');
        } catch (err) {}
      }
      markReadBtn.addEventListener('click', async function() { await fetch('/api/notifications?action=read-all', { method: 'POST' }); loadNotifications(); });
      loadNotifications(); setInterval(loadNotifications, 30000);
    } catch (err) {}
  })();
</script>

<script>
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function timeAgo(iso) { if (!iso) return '—'; var then = new Date(iso).getTime(); var now = Date.now(); var sec = Math.floor((now - then) / 1000); if (sec < 5) return 'just now'; if (sec < 60) return sec + 's ago'; var min = Math.floor(sec / 60); if (min < 60) return min + 'm ago'; var hr = Math.floor(min / 60); if (hr < 24) return hr + 'h ago'; var day = Math.floor(hr / 24); if (day < 30) return day + 'd ago'; var mon = Math.floor(day / 30); if (mon < 12) return mon + 'mo ago'; return Math.floor(mon / 12) + 'y ago'; }
  function getSlugFromPath() { var match = window.location.pathname.match(/^\/forums\/([a-z0-9-]+)/i); return match ? match[1] : null; }

  var currentSlug = getSlugFromPath();
  var currentUser = null;

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;
    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();
      currentUser = data.user;
      if (data.user) {
        var userChip = document.createElement('a'); userChip.className = 'action-chip'; userChip.href = '/@' + data.user.username; userChip.textContent = data.user.display_name || data.user.username;
        var logoutBtn = document.createElement('a'); logoutBtn.className = 'action-chip accent'; logoutBtn.href = '#'; logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) { e.preventDefault(); await fetch('/api/auth?action=logout', { method: 'POST' }); window.location.href = '/'; });
        actions.appendChild(userChip); actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a'); loginLink.className = 'action-chip'; loginLink.href = '/login'; loginLink.textContent = 'Log In';
        var signupLink = document.createElement('a'); signupLink.className = 'action-chip accent'; signupLink.href = '/signup'; signupLink.textContent = 'Sign Up';
        actions.appendChild(loginLink); actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  (async function () {
    var sidebarEl = document.getElementById('forumSidebar');
    var contentEl = document.getElementById('forumContent');
    if (!currentSlug) { contentEl.innerHTML = '<div class="loading-msg">Invalid category URL</div>'; return; }

    try {
      var catRes = await fetch('/api/forums?action=categories');
      var catData = await catRes.json();
      var categories = catData.categories || [];

      var grpRes = await fetch('/api/forums?action=groups');
      var grpData = await grpRes.json();
      var groups = grpData.groups || [];

      var threadRes = await fetch('/api/forums?action=threads&category=' + encodeURIComponent(currentSlug));
      if (!threadRes.ok) { contentEl.innerHTML = '<div class="loading-msg">Category not found</div>'; sidebarEl.innerHTML = ''; return; }
      var data = await threadRes.json();
      var category = data.category;
      var threads = data.threads || [];

      document.title = category.name + ' — PhonkHub Forums';

      function sidebarGroupHtml(group, cats) {
        if (cats.length === 0) return '';
        return (
          '<div class="sidebar-group">' +
            '<div class="sidebar-group-title">' + esc(group.label) + '</div>' +
            cats.map(function (c) {
              var active = c.slug === currentSlug ? ' active' : '';
              return '<a class="sidebar-item' + active + '" href="/forums/' + esc(c.slug) + '">' + esc(c.name) + (c.thread_count > 0 ? '<span class="sidebar-item-count">' + c.thread_count + '</span>' : '') + '</a>';
            }).join('') +
          '</div>'
        );
      }

      sidebarEl.innerHTML = groups.map(function(g) {
        var groupCats = categories.filter(function(c) { return c.group_name === g.name; });
        return sidebarGroupHtml(g, groupCats);
      }).join('');

      var newThreadBtnHtml = '';
      var canPost = currentUser && (!category.admin_only || currentUser.is_admin);
      if (canPost) {
        newThreadBtnHtml = '<a class="new-thread-btn" href="/forums/new?sub=' + esc(category.slug) + '">+ New Thread</a>';
      } else if (!currentUser && !category.admin_only) {
        newThreadBtnHtml = '<a class="new-thread-btn" href="/login">Log In to Post</a>';
      }

      var threadsHtml;
      if (threads.length === 0) {
        threadsHtml = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-msg">No threads yet</div>' + (canPost ? '<a class="new-thread-btn" href="/forums/new?sub=' + esc(category.slug) + '">Start the First Thread</a>' : '') + '</div>';
      } else {
        threadsHtml = '<div class="thread-list">' + threads.map(function (t) {
          var displayName = t.display_name || t.username;
          return (
            '<div class="thread-row' + (t.is_booster == 1 ? ' vip-glow' : '') + '">' +
              '<a class="thread-overlay" href="/forums/thread-' + t.id + '" aria-label="' + esc(t.title) + '"></a>' +
              '<div class="thread-title">' + esc(t.title) + '</div>' +
              '<div class="thread-meta">' +
                '<span>by <a class="thread-author" href="/@' + esc(t.username) + '">' + esc(displayName) + '</a></span>' +
                '<span>' + timeAgo(t.created_at) + '</span>' +
                '<span class="thread-meta-stat"><strong>' + (t.score > 0 ? '+' : '') + t.score + '</strong> score</span>' +
                '<span class="thread-meta-stat"><strong>' + t.reply_count + '</strong> repl' + (t.reply_count === 1 ? 'y' : 'ies') + '</span>' +
              '</div>' +
            '</div>'
          );
        }).join('') + '</div>';
      }

      contentEl.innerHTML =
        '<div class="forum-header">' +
          '<div class="forum-header-left">' +
            '<div class="breadcrumb"><a href="/forums">Forums</a><span class="breadcrumb-sep">/</span>' + esc(category.name) + '</div>' +
            '<div class="forum-title">' + esc(category.name) + '</div>' +
            '<div class="forum-desc">' + esc(category.description || '') + '</div>' +
          '</div>' + newThreadBtnHtml + '</div>' + threadsHtml;
    } catch (err) {
      contentEl.innerHTML = '<div class="loading-msg">Could not load threads</div>';
      sidebarEl.innerHTML = '';
    }
  })();
</script>
