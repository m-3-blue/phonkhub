<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track — PhonkHub</title>
<meta name="description" content="Official PhonkHub: Goon to the moon!" />
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --bg: #080808;
    --card-bg: #111;
    --border: #222;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body { min-height: 100vh; }

  body {
    background: #000000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-lockup {
    display: inline-flex;
    align-items: center;
    justify-self: start;
  }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent {
    background: var(--red);
    border-color: var(--red);
    color: #080808;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    width: 100%;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--red); }

  .player-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    border: 1px solid #1d1d1d;
    margin-bottom: 1.5rem;
  }
  .player-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .track-info {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding-bottom: 1.5rem;
  }

  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: var(--red);
    line-height: 1;
    flex-shrink: 0;
    text-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
  }

  .meta { flex: 1; min-width: 0; }

  .track-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .track-artist {
    color: #a2a2a2;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .vote-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0 1.5rem;
    border-bottom: 1px solid #1d1d1d;
    margin-bottom: 2rem;
  }

  .vote-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.9rem;
    background: transparent;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .vote-btn:hover:not(:disabled) {
    border-color: var(--red-dim);
    color: var(--red);
  }
  .vote-btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  .vote-btn.up.active {
    background: rgba(255, 153, 0, 0.15);
    border-color: var(--red);
    color: var(--red);
  }
  .vote-btn.down.active {
    background: rgba(120, 60, 60, 0.15);
    border-color: #995555;
    color: #ff7777;
  }

  .vote-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.75rem;
    color: var(--white);
    line-height: 1;
    min-width: 3rem;
    text-align: center;
  }
  .vote-score.positive { color: var(--red); }
  .vote-score.negative { color: #ff7777; }

  .vote-note {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1rem, 2vw, 1.35rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--white);
    text-transform: uppercase;
  }

  .section-heading {
    margin-bottom: 0.7rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid #1d1d1d;
    border-left: 3px solid var(--red);
    background: rgba(13, 13, 13, 0.8);
  }

  .track-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
  }

  .track-card {
    background: rgba(5, 5, 5, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
  }
  .track-card:hover {
    border-color: var(--red-dim);
    background: rgba(11, 11, 11, 0.95);
    transform: translateY(-2px);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    overflow: hidden;
  }
  .thumb-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s;
  }
  .track-card:hover .thumb-wrap img { transform: scale(1.04); }

  .track-header {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.65rem 0.75rem 0.85rem;
    border-top: 1px solid #181818;
    min-width: 0;
  }

  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    color: var(--red);
    line-height: 1;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .track-meta {
    display: flex;
    flex: 1;
    min-width: 0;
    flex-direction: column;
  }

  .card-title {
    order: 2;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.035em;
    line-height: 1.08;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-artist {
    order: 1;
    margin: 0 0 0.25rem;
    color: #a2a2a2;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  footer {
    background: #000000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

  .loading-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (max-width: 780px) {
    .header-main { grid-template-columns: auto 1fr auto; gap: 0.7rem; }
    .header-actions { gap: 0.35rem; }
    .action-chip { padding: 0.35rem 0.55rem; font-size: 0.62rem; }
    .track-list { grid-template-columns: 1fr; }
    main { padding: 0 0.75rem 3rem; }
  }

  @media (max-width: 480px) {
    .header-main { padding: 0.65rem 0.75rem; }
    .rank { font-size: 2.5rem; }
    .vote-row { flex-wrap: wrap; }
    .vote-note { width: 100%; margin-left: 0; text-align: center; margin-top: 0.5rem; }
  }
</style>
</head>

<body>
  <header id="top">
    <div class="header-main">
      <a class="brand-lockup" href="/" aria-label="PhonkHub home">
        <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
      </a>
      <div></div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <main id="main">
    <div class="loading-msg">Loading…</div>
  </main>

  <footer>
    <p>
      <span class="tagline">New Tracks Added Periodically</span><br />&nbsp;<br />
      &copy; 2026 PhonkHub &nbsp;·&nbsp; Property Of ¥GoyMafia¥&trade; &nbsp;·&nbsp; All Rights To The Respective Artists
    </p>
  </footer>

<script>
  function thumbUrl(id) {
    return 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function getTrackId() {
    var match = window.location.pathname.match(/^\/track-(\d+)/);
    return match ? match[1] : null;
  }

  function buildCard(track) {
    return (
      '<a class="track-card" href="/track-' + track.id + '">' +
        '<div class="thumb-wrap">' +
          '<img loading="lazy" src="' + thumbUrl(track.youtube_id) + '" alt="' + esc(track.title) + '">' +
        '</div>' +
        '<div class="track-header">' +
          '<span class="card-rank">' + track.id + '</span>' +
          '<div class="track-meta">' +
            '<div class="card-title">' + esc(track.title) + '</div>' +
            '<div class="card-artist">' + esc(track.artist) + '</div>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  // ---- Header auth ----
  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;

    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();

      if (data.user) {
        var userChip = document.createElement('a');
        userChip.className = 'action-chip';
        userChip.href = '/@' + data.user.username;
        userChip.textContent = '@' + data.user.username;

        var logoutBtn = document.createElement('a');
        logoutBtn.className = 'action-chip accent';
        logoutBtn.href = '#';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          await fetch('/api/auth?action=logout', { method: 'POST' });
          window.location.href = '/';
        });

        actions.appendChild(userChip);
        actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a');
        loginLink.className = 'action-chip';
        loginLink.href = '/login';
        loginLink.textContent = 'Log In';

        var signupLink = document.createElement('a');
        signupLink.className = 'action-chip accent';
        signupLink.href = '/signup';
        signupLink.textContent = 'Sign Up';

        actions.appendChild(loginLink);
        actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  // ---- Voting state ----
  var currentUserVote = 0;
  var voteScore = 0;
  var loggedIn = false;
  var currentTrackId = null;

  function renderVotes() {
    var scoreEl = document.getElementById('voteScore');
    var upBtn = document.getElementById('upBtn');
    var downBtn = document.getElementById('downBtn');
    var noteEl = document.getElementById('voteNote');
    if (!scoreEl) return;

    scoreEl.textContent = voteScore;
    scoreEl.className = 'vote-score' +
      (voteScore > 0 ? ' positive' : voteScore < 0 ? ' negative' : '');

    upBtn.classList.toggle('active', currentUserVote === 1);
    downBtn.classList.toggle('active', currentUserVote === -1);

    if (!loggedIn) {
      upBtn.disabled = true;
      downBtn.disabled = true;
      noteEl.textContent = 'Log in to vote';
    } else {
      upBtn.disabled = false;
      downBtn.disabled = false;
      noteEl.textContent = '';
    }
  }

  async function castVote(value) {
    if (!loggedIn) return;

    var newValue = (currentUserVote === value) ? 0 : value;

    try {
      var res = await fetch('/api/votes?action=cast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ track_id: parseInt(currentTrackId, 10), value: newValue }),
      });
      var data = await res.json();
      if (!res.ok) return;
      voteScore = data.score;
      currentUserVote = data.userVote;
      renderVotes();
    } catch (err) {}
  }

  function attachVoteHandlers() {
    var upBtn = document.getElementById('upBtn');
    var downBtn = document.getElementById('downBtn');
    if (!upBtn) return;
    upBtn.onclick = function () { castVote(1); };
    downBtn.onclick = function () { castVote(-1); };
  }

  // ---- Load track page (single request) ----
  var id = getTrackId();
  if (!id) {
    document.getElementById('main').innerHTML = '<div class="loading-msg">Track not found</div>';
  } else {
    currentTrackId = id;

    fetch('/api/track-page?id=' + id)
      .then(function (r) {
        if (!r.ok) throw new Error('Track not found');
        return r.json();
      })
      .then(function (data) {
        var t = data.track;
        var recs = data.recommended || [];

        voteScore = data.score || 0;
        currentUserVote = data.userVote || 0;
        loggedIn = !!data.user;

        var html =
          '<a class="back-link" href="/">← Back to all tracks</a>' +
          '<div class="player-wrap">' +
            '<iframe src="https://www.youtube.com/embed/' + t.youtube_id + '?autoplay=1" ' +
              'title="' + esc(t.title) + '" ' +
              'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
              'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
          '</div>' +
          '<div class="track-info">' +
            '<span class="rank">' + t.id + '</span>' +
            '<div class="meta">' +
              '<div class="track-title">' + esc(t.title) + '</div>' +
              '<div class="track-artist">' + esc(t.artist) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="vote-row">' +
            '<button class="vote-btn up" id="upBtn">▲</button>' +
            '<div class="vote-score" id="voteScore">0</div>' +
            '<button class="vote-btn down" id="downBtn">▼</button>' +
            '<div class="vote-note" id="voteNote"></div>' +
          '</div>' +
          '<div class="section-heading"><h2 class="section-title">Recommended</h2></div>' +
          '<div class="track-list">' +
            recs.map(buildCard).join('') +
          '</div>';

        document.getElementById('main').innerHTML = html;
        document.title = t.title + ' — PhonkHub';

        attachVoteHandlers();
        renderVotes();
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="loading-msg">Track not found</div>';
      });
  }
</script>
