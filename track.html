<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track — PhonkHub</title>
<meta name="description" content="Official PhonkHub: Goon to the moon!" />
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --bg: #080808;
    --card-bg: #111;
    --border: #222;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100vh; }

  body {
    background: #000000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-lockup { display: inline-flex; align-items: center; justify-self: start; }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent {
    background: var(--red);
    border-color: var(--red);
    color: #080808;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    width: 100%;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--red); }

  .player-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    border: 1px solid #1d1d1d;
    margin-bottom: 1.5rem;
  }
  .player-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .track-info {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding-bottom: 1.5rem;
  }

  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: var(--red);
    line-height: 1;
    flex-shrink: 0;
    text-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
  }

  .meta { flex: 1; min-width: 0; }

  .track-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .track-artist {
    color: #a2a2a2;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .vote-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0 1.5rem;
    border-bottom: 1px solid #1d1d1d;
    margin-bottom: 2rem;
  }

  .vote-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.9rem;
    background: transparent;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .vote-btn:hover:not(:disabled) { border-color: var(--red-dim); color: var(--red); }
  .vote-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .vote-btn.up.active { background: rgba(255, 153, 0, 0.15); border-color: var(--red); color: var(--red); }
  .vote-btn.down.active { background: rgba(120, 60, 60, 0.15); border-color: #995555; color: #ff7777; }

  .vote-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.75rem;
    color: var(--white);
    line-height: 1;
    min-width: 3rem;
    text-align: center;
  }
  .vote-score.positive { color: var(--red); }
  .vote-score.negative { color: #ff7777; }

  .vote-note {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1rem, 2vw, 1.35rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--white);
    text-transform: uppercase;
  }

  .section-heading {
    margin-bottom: 0.7rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid #1d1d1d;
    border-left: 3px solid var(--red);
    background: rgba(13, 13, 13, 0.8);
  }

  .track-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
  }

  .track-card {
    background: rgba(5, 5, 5, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
  }
  .track-card:hover { border-color: var(--red-dim); background: rgba(11, 11, 11, 0.95); transform: translateY(-2px); }

  .thumb-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    overflow: hidden;
  }
  .thumb-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s;
  }
  .track-card:hover .thumb-wrap img { transform: scale(1.04); }

  .track-header {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.65rem 0.75rem 0.85rem;
    border-top: 1px solid #181818;
    min-width: 0;
  }

  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    color: var(--red);
    line-height: 1;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .track-meta { display: flex; flex: 1; min-width: 0; flex-direction: column; }

  .card-title {
    order: 2;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.035em;
    line-height: 1.08;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-artist {
    order: 1;
    margin: 0 0 0.25rem;
    color: #a2a2a2;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* -------- COMMENTS -------- */
  .comments-section { margin-top: 2.5rem; }

  .comment-form-box {
    background: rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--red);
    border-radius: 2px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .comment-form-box textarea {
    width: 100%;
    min-height: 60px;
    padding: 0.75rem 0.9rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.9rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
    font-family: inherit;
  }
  .comment-form-box textarea:focus { border-color: var(--red-dim); }

  .comment-form-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .comment-form-actions button {
    padding: 0.65rem 1.5rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: opacity 0.2s;
  }
  .comment-form-actions button:hover { opacity: 0.85; }
  .comment-form-actions button:disabled { opacity: 0.4; cursor: wait; }

  .comment-char-count {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
  }
  .comment-char-count.over { color: #ff5555; }

  .comment-form-status {
    margin-top: 0.6rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-height: 1rem;
  }
  .comment-form-status.err { color: #ff5555; }

  .comment-login-prompt {
    padding: 1.5rem;
    text-align: center;
    background: rgba(13, 13, 13, 0.95);
    border: 1px dashed #1d1d1d;
    border-radius: 2px;
    margin-bottom: 1.5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
  }
  .comment-login-prompt a { color: var(--red); text-decoration: none; }
  .comment-login-prompt a:hover { text-decoration: underline; }

  .comment-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .comment {
    background: rgba(13, 13, 13, 0.7);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    padding: 0.9rem 1rem;
  }

  .comment-header {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }

  .comment-author {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--red);
    text-decoration: none;
    text-transform: uppercase;
  }
  .comment-author:hover { text-decoration: underline; }

  .comment-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: #666;
    text-transform: uppercase;
  }

  .comment-edited {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: #555;
    text-transform: uppercase;
    font-style: italic;
  }

  .comment-body {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #ddd;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .comment-body a.mention {
    color: var(--red);
    text-decoration: none;
    font-weight: 700;
  }
  .comment-body a.mention:hover { text-decoration: underline; }

  .comment-actions {
    display: flex;
    gap: 0.85rem;
    margin-top: 0.6rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    align-items: center;
  }

  .comment-actions button {
    background: transparent;
    border: none;
    padding: 0;
    color: #777;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    transition: color 0.15s;
  }
  .comment-actions button:hover { color: var(--red); }
  .comment-actions button.delete-btn:hover { color: #ff5555; }

  .comment-actions button.like-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
  }
  .comment-actions button.like-btn .like-icon {
    font-size: 1.15rem;
    line-height: 1;
  }
  .comment-actions button.like-btn .like-count {
    font-size: 0.85rem;
  }
  .comment-actions button.like-btn.liked {
    color: var(--red);
  }
  .comment-actions button.like-btn:hover {
    color: var(--red);
  }
  .comment-actions button.like-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .comment-replies {
    margin-top: 0.6rem;
    padding-left: 1.25rem;
    border-left: 2px solid #1d1d1d;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .comment-replies.deep {
    padding-left: 0.5rem;
    border-left-color: #161616;
  }

  .reply-form-container, .edit-form-container {
    margin-top: 0.6rem;
    display: none;
  }
  .reply-form-container.open, .edit-form-container.open { display: block; }

  .reply-form-container textarea, .edit-form-container textarea {
    width: 100%;
    min-height: 50px;
    padding: 0.6rem 0.75rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.85rem;
    resize: vertical;
    outline: none;
    border-radius: 2px;
    font-family: inherit;
  }
  .reply-form-container textarea:focus, .edit-form-container textarea:focus { border-color: var(--red-dim); }

  .reply-form-actions, .edit-form-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .reply-form-actions button, .edit-form-actions button {
    padding: 0.45rem 1rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
  }
  .reply-form-actions button.ghost, .edit-form-actions button.ghost {
    background: transparent;
    color: var(--white);
    border-color: #444;
  }

  .no-comments {
    text-align: center;
    padding: 2rem 1rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
  }

  footer {
    background: #000000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

  .loading-msg {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (max-width: 780px) {
    .header-main { grid-template-columns: auto 1fr auto; gap: 0.7rem; }
    .header-actions { gap: 0.35rem; }
    .action-chip { padding: 0.35rem 0.55rem; font-size: 0.62rem; }
    .track-list { grid-template-columns: 1fr; }
    main { padding: 0 0.75rem 3rem; }
    .comment-replies { padding-left: 0.75rem; }
  }

  @media (max-width: 480px) {
    .header-main { padding: 0.65rem 0.75rem; }
    .rank { font-size: 2.5rem; }
    .vote-row { flex-wrap: wrap; }
    .vote-note { width: 100%; margin-left: 0; text-align: center; margin-top: 0.5rem; }
  }
</style>
</head>

<body>
  <header id="top">
    <div class="header-main">
      <a class="brand-lockup" href="/" aria-label="PhonkHub home">
        <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
      </a>
      <div></div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <main id="main">
    <div class="loading-msg">Loading…</div>
  </main>

  <footer>
    <p>
      <span class="tagline">New Tracks Added Periodically</span><br />&nbsp;<br />
      &copy; 2026 PhonkHub &nbsp;·&nbsp; Property Of ¥GoyMafia¥&trade; &nbsp;·&nbsp; All Rights To The Respective Artists
    </p>
  </footer>

<script>
  var MAX_COMMENT = 100;

  function thumbUrl(id) {
    return 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderBody(raw) {
    var safe = esc(raw);
    return safe.replace(/(^|[^a-zA-Z0-9_])@([a-zA-Z0-9_]{3,20})\b/g, function (m, prefix, username) {
      return prefix + '<a class="mention" href="/@' + username + '">@' + username + '</a>';
    });
  }

  function getTrackId() {
    var match = window.location.pathname.match(/^\/track-(\d+)/);
    return match ? match[1] : null;
  }

  function buildCard(track) {
    return (
      '<a class="track-card" href="/track-' + track.id + '">' +
        '<div class="thumb-wrap">' +
          '<img loading="lazy" src="' + thumbUrl(track.youtube_id) + '" alt="' + esc(track.title) + '">' +
        '</div>' +
        '<div class="track-header">' +
          '<span class="card-rank">' + track.id + '</span>' +
          '<div class="track-meta">' +
            '<div class="card-title">' + esc(track.title) + '</div>' +
            '<div class="card-artist">' + esc(track.artist) + '</div>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  function timeAgo(iso) {
    var then = new Date(iso).getTime();
    var now = Date.now();
    var sec = Math.floor((now - then) / 1000);

    if (sec < 5) return 'just now';
    if (sec < 60) return sec + 's ago';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    var day = Math.floor(hr / 24);
    if (day < 30) return day + 'd ago';
    var mon = Math.floor(day / 30);
    if (mon < 12) return mon + 'mo ago';
    var yr = Math.floor(mon / 12);
    return yr + 'y ago';
  }

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;

    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();

      if (data.user) {
        var userChip = document.createElement('a');
        userChip.className = 'action-chip';
        userChip.href = '/@' + data.user.username;
        userChip.textContent = data.user.display_name || data.user.username;

        var logoutBtn = document.createElement('a');
        logoutBtn.className = 'action-chip accent';
        logoutBtn.href = '#';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          await fetch('/api/auth?action=logout', { method: 'POST' });
          window.location.href = '/';
        });

        actions.appendChild(userChip);
        actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a');
        loginLink.className = 'action-chip';
        loginLink.href = '/login';
        loginLink.textContent = 'Log In';

        var signupLink = document.createElement('a');
        signupLink.className = 'action-chip accent';
        signupLink.href = '/signup';
        signupLink.textContent = 'Sign Up';

        actions.appendChild(loginLink);
        actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  var currentUserVote = 0;
  var voteScore = 0;
  var loggedIn = false;
  var currentUser = null;
  var currentTrackId = null;

  function renderVotes() {
    var scoreEl = document.getElementById('voteScore');
    var upBtn = document.getElementById('upBtn');
    var downBtn = document.getElementById('downBtn');
    var noteEl = document.getElementById('voteNote');
    if (!scoreEl) return;

    scoreEl.textContent = voteScore;
    scoreEl.className = 'vote-score' +
      (voteScore > 0 ? ' positive' : voteScore < 0 ? ' negative' : '');

    upBtn.classList.toggle('active', currentUserVote === 1);
    downBtn.classList.toggle('active', currentUserVote === -1);

    if (!loggedIn) {
      upBtn.disabled = true;
      downBtn.disabled = true;
      noteEl.textContent = 'Log in to vote';
    } else {
      upBtn.disabled = false;
      downBtn.disabled = false;
      noteEl.textContent = '';
    }
  }

  async function castVote(value) {
    if (!loggedIn) return;
    var newValue = (currentUserVote === value) ? 0 : value;

    try {
      var res = await fetch('/api/votes?action=cast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ track_id: parseInt(currentTrackId, 10), value: newValue }),
      });
      var data = await res.json();
      if (!res.ok) return;
      voteScore = data.score;
      currentUserVote = data.userVote;
      renderVotes();
    } catch (err) {}
  }

  function attachVoteHandlers() {
    var upBtn = document.getElementById('upBtn');
    var downBtn = document.getElementById('downBtn');
    if (!upBtn) return;
    upBtn.onclick = function () { castVote(1); };
    downBtn.onclick = function () { castVote(-1); };
  }

  var commentsData = [];

  async function loadComments() {
    try {
      var res = await fetch('/api/comments?action=list&track_id=' + currentTrackId);
      var data = await res.json();
      commentsData = data.comments || [];
      renderComments();
    } catch (err) {}
  }

  function renderComments() {
    var listEl = document.getElementById('commentList');
    if (!listEl) return;

    if (commentsData.length === 0) {
      listEl.innerHTML = '<div class="no-comments">No comments yet. Be the first.</div>';
      return;
    }

    listEl.innerHTML = commentsData.map(function (c) {
      return renderComment(c, 0);
    }).join('');

    attachCommentHandlers();
  }

  function renderComment(c, depth) {
    var repliesHtml = '';

    if (c.replies && c.replies.length) {
      repliesHtml = '<div class="' + (depth >= 3 ? 'comment-replies deep' : 'comment-replies') + '">' +
        c.replies.map(function (r) { return renderComment(r, depth + 1); }).join('') +
      '</div>';
    }

    var isOwn = currentUser && currentUser.id === c.user.id;

    var likeBtnHtml =
      '<button class="like-btn' + (c.user_liked ? ' liked' : '') + '" data-like="' + c.id + '"' + (loggedIn ? '' : ' disabled') + '>' +
        '<span class="like-icon">' + (c.user_liked ? '♥' : '♡') + '</span>' +
        '<span class="like-count">' + (c.like_count || 0) + '</span>' +
      '</button>';

    var actions = [likeBtnHtml];
    if (loggedIn) {
      actions.push('<button data-reply="' + c.id + '">Reply</button>');
    }
    if (isOwn) {
      actions.push('<button data-edit="' + c.id + '">Edit</button>');
      actions.push('<button class="delete-btn" data-delete="' + c.id + '">Delete</button>');
    }

    var displayName = c.user.display_name || c.user.username;
    var editedTag = c.edited_at ? '<span class="comment-edited">(edited)</span>' : '';

    return (
      '<div class="comment" data-comment-id="' + c.id + '">' +
        '<div class="comment-header">' +
          '<a class="comment-author" href="/@' + esc(c.user.username) + '">' + esc(displayName) + '</a>' +
          '<span class="comment-time">' + timeAgo(c.created_at) + '</span>' +
          editedTag +
        '</div>' +
        '<div class="comment-body" data-body-for="' + c.id + '">' + renderBody(c.body) + '</div>' +
        '<div class="comment-actions">' + actions.join('') + '</div>' +
        '<div class="reply-form-container" data-reply-form="' + c.id + '">' +
          '<textarea placeholder="Write a reply…" maxlength="' + MAX_COMMENT + '" data-reply-body="' + c.id + '"></textarea>' +
          '<div class="reply-form-actions">' +
            '<button data-reply-submit="' + c.id + '">Post Reply</button>' +
            '<button class="ghost" data-reply-cancel="' + c.id + '">Cancel</button>' +
          '</div>' +
        '</div>' +
        '<div class="edit-form-container" data-edit-form="' + c.id + '">' +
          '<textarea maxlength="' + MAX_COMMENT + '" data-edit-body="' + c.id + '">' + esc(c.body) + '</textarea>' +
          '<div class="edit-form-actions">' +
            '<button data-edit-submit="' + c.id + '">Save</button>' +
            '<button class="ghost" data-edit-cancel="' + c.id + '">Cancel</button>' +
          '</div>' +
        '</div>' +
        repliesHtml +
      '</div>'
    );
  }

  function attachCommentHandlers() {
    var listEl = document.getElementById('commentList');
    if (!listEl || listEl.dataset.wired) return;
    listEl.dataset.wired = '1';

    listEl.addEventListener('click', function (e) {
      var replyBtn = e.target.closest('[data-reply]');
      var replySubmit = e.target.closest('[data-reply-submit]');
      var replyCancel = e.target.closest('[data-reply-cancel]');
      var editBtn = e.target.closest('[data-edit]');
      var editSubmit = e.target.closest('[data-edit-submit]');
      var editCancel = e.target.closest('[data-edit-cancel]');
      var delBtn = e.target.closest('[data-delete]');
      var likeBtn = e.target.closest('[data-like]');

      if (replyBtn) {
        var id = replyBtn.getAttribute('data-reply');
        var form = listEl.querySelector('[data-reply-form="' + id + '"]');
        if (form) {
          form.classList.toggle('open');
          if (form.classList.contains('open')) {
            var ta = form.querySelector('textarea');
            if (ta) ta.focus();
          }
        }
      }

      if (replyCancel) {
        var cancelId = replyCancel.getAttribute('data-reply-cancel');
        var cancelForm = listEl.querySelector('[data-reply-form="' + cancelId + '"]');
        if (cancelForm) {
          cancelForm.classList.remove('open');
          var ta2 = cancelForm.querySelector('textarea');
          if (ta2) ta2.value = '';
        }
      }

      if (replySubmit) {
        var submitId = replySubmit.getAttribute('data-reply-submit');
        var submitForm = listEl.querySelector('[data-reply-form="' + submitId + '"]');
        if (submitForm) {
          var ta3 = submitForm.querySelector('textarea');
          var body = ta3 ? ta3.value.trim() : '';
          if (body) submitReply(submitId, body, ta3);
        }
      }

      if (editBtn) {
        var editId = editBtn.getAttribute('data-edit');
        var editForm = listEl.querySelector('[data-edit-form="' + editId + '"]');
        if (editForm) {
          editForm.classList.add('open');
          var editTa = editForm.querySelector('textarea');
          if (editTa) { editTa.focus(); editTa.select(); }
        }
      }

      if (editCancel) {
        var ecId = editCancel.getAttribute('data-edit-cancel');
        var ecForm = listEl.querySelector('[data-edit-form="' + ecId + '"]');
        if (ecForm) ecForm.classList.remove('open');
      }

      if (editSubmit) {
        var esId = editSubmit.getAttribute('data-edit-submit');
        var esForm = listEl.querySelector('[data-edit-form="' + esId + '"]');
        if (esForm) {
          var esTa = esForm.querySelector('textarea');
          var newBody = esTa ? esTa.value.trim() : '';
          if (newBody) submitEdit(esId, newBody);
        }
      }

      if (delBtn) {
        var delId = delBtn.getAttribute('data-delete');
        if (confirm('Delete this comment?')) deleteComment(delId);
      }

      if (likeBtn && !likeBtn.disabled) {
        var likeId = likeBtn.getAttribute('data-like');
        toggleLike(likeId, likeBtn);
      }
    });
  }

  async function submitReply(parentId, body, ta) {
    if (body.length > MAX_COMMENT) { alert('Max ' + MAX_COMMENT + ' characters'); return; }
    try {
      var res = await fetch('/api/comments?action=post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ track_id: parseInt(currentTrackId, 10), parent_id: parseInt(parentId, 10), body: body }),
      });
      if (!res.ok) {
        var err = await res.json();
        alert(err.error || 'Could not post reply');
        return;
      }
      if (ta) ta.value = '';
      var form = document.querySelector('[data-reply-form="' + parentId + '"]');
      if (form) form.classList.remove('open');
      await loadComments();
    } catch (err) {
      alert('Network error');
    }
  }

  async function submitEdit(id, body) {
    if (body.length > MAX_COMMENT) { alert('Max ' + MAX_COMMENT + ' characters'); return; }
    try {
      var res = await fetch('/api/comments?action=edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: parseInt(id, 10), body: body }),
      });
      if (!res.ok) {
        var err = await res.json();
        alert(err.error || 'Could not save');
        return;
      }
      var form = document.querySelector('[data-edit-form="' + id + '"]');
      if (form) form.classList.remove('open');
      await loadComments();
    } catch (err) {
      alert('Network error');
    }
  }

  async function deleteComment(id) {
    try {
      var res = await fetch('/api/comments?action=delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: parseInt(id, 10) }),
      });
      if (!res.ok) {
        var err = await res.json();
        alert(err.error || 'Could not delete');
        return;
      }
      await loadComments();
    } catch (err) {
      alert('Network error');
    }
  }

  async function toggleLike(id, btnEl) {
    // Optimistic update: toggle instantly, then reconcile with server response
    var wasLiked = btnEl.classList.contains('liked');
    var iconEl = btnEl.querySelector('.like-icon');
    var countEl = btnEl.querySelector('.like-count');
    var oldCount = parseInt(countEl.textContent, 10) || 0;

    btnEl.classList.toggle('liked', !wasLiked);
    iconEl.textContent = !wasLiked ? '♥' : '♡';
    countEl.textContent = !wasLiked ? oldCount + 1 : Math.max(0, oldCount - 1);

    try {
      var res = await fetch('/api/comments?action=like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: parseInt(id, 10) }),
      });
      var data = await res.json();
      if (!res.ok) {
        // Revert on error
        btnEl.classList.toggle('liked', wasLiked);
        iconEl.textContent = wasLiked ? '♥' : '♡';
        countEl.textContent = oldCount;
        return;
      }
      // Reconcile with authoritative values from server
      btnEl.classList.toggle('liked', data.liked);
      iconEl.textContent = data.liked ? '♥' : '♡';
      countEl.textContent = data.like_count;
    } catch (err) {
      // Revert on network error
      btnEl.classList.toggle('liked', wasLiked);
      iconEl.textContent = wasLiked ? '♥' : '♡';
      countEl.textContent = oldCount;
    }
  }

  function attachTopLevelCommentForm() {
    var form = document.getElementById('commentForm');
    if (!form) return;

    var ta = form.querySelector('textarea');
    var btn = form.querySelector('button[type="submit"]');
    var countEl = document.getElementById('commentCharCount');
    var statusEl = document.getElementById('commentFormStatus');

    function updateCount() {
      var len = ta.value.length;
      countEl.textContent = len + ' / ' + MAX_COMMENT;
      countEl.classList.toggle('over', len > MAX_COMMENT);
    }
    ta.addEventListener('input', updateCount);
    updateCount();

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var body = ta.value.trim();
      if (!body) {
        statusEl.textContent = 'Write something first';
        statusEl.className = 'comment-form-status err';
        return;
      }
      if (body.length > MAX_COMMENT) {
        statusEl.textContent = 'Max ' + MAX_COMMENT + ' characters';
        statusEl.className = 'comment-form-status err';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Posting…';
      statusEl.className = 'comment-form-status';

      try {
        var res = await fetch('/api/comments?action=post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ track_id: parseInt(currentTrackId, 10), parent_id: null, body: body }),
        });

        if (!res.ok) {
          var err = await res.json();
          statusEl.textContent = err.error || 'Failed';
          statusEl.className = 'comment-form-status err';
          btn.disabled = false;
          return;
        }

        ta.value = '';
        updateCount();
        statusEl.textContent = '';
        await loadComments();
      } catch (err) {
        statusEl.textContent = 'Network error';
        statusEl.className = 'comment-form-status err';
      }

      btn.disabled = false;
    });
  }

  var id = getTrackId();
  if (!id) {
    document.getElementById('main').innerHTML = '<div class="loading-msg">Track not found</div>';
  } else {
    currentTrackId = id;

    fetch('/api/track-page?id=' + id)
      .then(function (r) {
        if (!r.ok) throw new Error('Track not found');
        return r.json();
      })
      .then(function (data) {
        var t = data.track;
        var recs = data.recommended || [];

        voteScore = data.score || 0;
        currentUserVote = data.userVote || 0;
        loggedIn = !!data.user;
        currentUser = data.user;

        var commentBoxHtml;
        if (loggedIn) {
          commentBoxHtml =
            '<form class="comment-form-box" id="commentForm">' +
              '<textarea placeholder="Write a comment…" maxlength="' + MAX_COMMENT + '"></textarea>' +
              '<div class="comment-form-actions">' +
                '<button type="submit">Post Comment</button>' +
                '<div class="comment-char-count" id="commentCharCount">0 / ' + MAX_COMMENT + '</div>' +
              '</div>' +
              '<div class="comment-form-status" id="commentFormStatus"></div>' +
            '</form>';
        } else {
          commentBoxHtml =
            '<div class="comment-login-prompt">' +
              '<a href="/login">Log in</a> or <a href="/signup">sign up</a> to comment' +
            '</div>';
        }

        var html =
          '<a class="back-link" href="/">← Back to all tracks</a>' +
          '<div class="player-wrap">' +
            '<iframe src="https://www.youtube.com/embed/' + t.youtube_id + '?autoplay=1" ' +
              'title="' + esc(t.title) + '" ' +
              'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
              'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
          '</div>' +
          '<div class="track-info">' +
            '<span class="rank">' + t.id + '</span>' +
            '<div class="meta">' +
              '<div class="track-title">' + esc(t.title) + '</div>' +
              '<div class="track-artist">' + esc(t.artist) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="vote-row">' +
            '<button class="vote-btn up" id="upBtn">▲</button>' +
            '<div class="vote-score" id="voteScore">0</div>' +
            '<button class="vote-btn down" id="downBtn">▼</button>' +
            '<div class="vote-note" id="voteNote"></div>' +
          '</div>' +
          '<div class="section-heading"><h2 class="section-title">Recommended</h2></div>' +
          '<div class="track-list">' +
            recs.map(buildCard).join('') +
          '</div>' +
          '<div class="comments-section">' +
            '<div class="section-heading"><h2 class="section-title">Comments</h2></div>' +
            commentBoxHtml +
            '<div class="comment-list" id="commentList"><div class="no-comments">Loading…</div></div>' +
          '</div>';

        document.getElementById('main').innerHTML = html;
        document.title = t.title + ' — PhonkHub';

        attachVoteHandlers();
        renderVotes();
        attachTopLevelCommentForm();
        loadComments();
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="loading-msg">Track not found</div>';
      });
  }
</script>
