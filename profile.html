<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
    --accent: #ff9900;
    --accent-rgb: 255, 153, 0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-lockup {
    display: inline-flex;
    align-items: center;
    justify-self: start;
  }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent {
    background: var(--red);
    border-color: var(--red);
    color: #080808;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    width: 100%;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--red); }

  .profile-box {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), transparent 55%),
      rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--accent);
    border-radius: 2px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .banner {
    height: 160px;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.35), transparent 60%),
      linear-gradient(160deg, #181818, #0a0a0a);
    position: relative;
    border-bottom: 1px solid #1d1d1d;
    overflow: hidden;
  }

  .profile-body {
    padding: 0 1.75rem 1.75rem;
    position: relative;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #0a0a0a;
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--accent);
    margin-top: -48px;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .display-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.15rem;
    color: var(--white);
  }

  .handle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 0.35rem;
  }

  .joined {
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .edit-profile-btn {
    position: absolute;
    top: 3.5rem;
    right: 1.75rem;
    padding: 0.55rem 1.1rem;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #444;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
    backdrop-filter: blur(4px);
  }
  .edit-profile-btn:hover { border-color: var(--accent); color: var(--accent); }

  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #1d1d1d;
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }

  .tab {
    flex: 0 0 auto;
    padding: 0.9rem 1.4rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: #888;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--white); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-count {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    background: #1a1a1a;
    border-radius: 999px;
    font-size: 0.6rem;
    color: #999;
    letter-spacing: 0.05em;
  }
  .tab.active .tab-count {
    background: rgba(var(--accent-rgb), 0.15);
    color: var(--accent);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .empty-section {
    padding: 2rem 1rem;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    border: 1px dashed #1d1d1d;
    border-radius: 2px;
  }

  .post-item {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.06), transparent 60%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.5rem;
  }

  .post-context {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 0.5rem;
  }
  .post-context a {
    color: var(--accent);
    text-decoration: none;
  }
  .post-context a:hover { text-decoration: underline; }

  .post-body {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #ddd;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 0.5rem;
  }

  .post-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
  }

  .vote-item {
    display: grid;
    grid-template-columns: 2.5rem 1fr auto;
    gap: 0.9rem;
    align-items: center;
    padding: 0.7rem 0.9rem;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.05), transparent 65%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    margin-bottom: 0.4rem;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .vote-item:hover {
    border-color: var(--accent);
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.1), transparent 65%),
      rgba(20, 20, 20, 0.95);
  }

  .vote-arrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    line-height: 1;
    text-align: center;
  }
  .vote-arrow.up { color: var(--accent); }
  .vote-arrow.down { color: #ff7777; }

  .vote-info { min-width: 0; }
  .vote-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vote-artist {
    font-size: 0.68rem;
    color: #999;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .vote-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
    white-space: nowrap;
  }

  .bio-box {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.08), transparent 65%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    line-height: 1.55;
    color: #ddd;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .socials-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .social-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.05), transparent 70%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #2a2a2a;
    border-radius: 2px;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .social-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .social-link .platform {
    color: #888;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
  }
  .social-link .value {
    color: inherit;
    text-transform: none;
    letter-spacing: 0.03em;
    font-weight: 600;
  }

  .about-row {
    display: flex;
    justify-content: space-between;
    padding: 0.9rem 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .about-row:last-child { border-bottom: none; }

  .about-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
  }

  .about-value {
    font-size: 0.9rem;
    color: var(--white);
    text-align: right;
  }

  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  footer {
    background: #000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

  @media (max-width: 480px) {
    .header-main { padding: 0.65rem 0.75rem; }
    .profile-body { padding: 0 1rem 1.5rem; }
    .avatar { width: 80px; height: 80px; font-size: 2rem; margin-top: -40px; }
    .display-name { font-size: 1.4rem; }
    .vote-item { grid-template-columns: 2rem 1fr auto; gap: 0.5rem; padding: 0.6rem 0.7rem; }
    .edit-profile-btn { top: 3rem; right: 1rem; padding: 0.45rem 0.8rem; font-size: 0.62rem; }
  }
</style>
</head>

<body>
  <header>
    <div class="header-main">
      <a class="brand-lockup" href="/" aria-label="PhonkHub home">
        <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
      </a>
      <div></div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <main id="main">
    <div class="loading">Loading…</div>
  </main>

  <footer>
    <p>
      <span class="tagline">New Tracks Added Periodically</span><br />&nbsp;<br />
      &copy; 2026 PhonkHub &nbsp;·&nbsp; Property Of ¥GoyMafia¥&trade; &nbsp;·&nbsp; All Rights To The Respective Artists
    </p>
  </footer>

<script>
  var PLATFORM_LABELS = {
    discord: 'Discord',
    youtube: 'YouTube',
    soundcloud: 'SoundCloud',
    twitter: 'Twitter',
    instagram: 'Instagram',
    spotify: 'Spotify',
  };

  function socialHref(platform, value) {
    var v = value.trim();
    if (/^https?:\/\//i.test(v)) return v;

    switch (platform) {
      case 'discord':    return null;
      case 'youtube':    return 'https://youtube.com/' + (v.startsWith('@') ? v : '@' + v);
      case 'soundcloud': return 'https://soundcloud.com/' + v.replace(/^@/, '');
      case 'twitter':    return 'https://x.com/' + v.replace(/^@/, '');
      case 'instagram':  return 'https://instagram.com/' + v.replace(/^@/, '');
      case 'spotify':    return 'https://open.spotify.com/user/' + v.replace(/^@/, '');
      default:           return null;
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDate(iso) {
    var d = new Date(iso);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
  }

  function timeAgo(iso) {
    var then = new Date(iso).getTime();
    var now = Date.now();
    var sec = Math.floor((now - then) / 1000);
    if (sec < 5) return 'just now';
    if (sec < 60) return sec + 's ago';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    var day = Math.floor(hr / 24);
    if (day < 30) return day + 'd ago';
    var mon = Math.floor(day / 30);
    if (mon < 12) return mon + 'mo ago';
    return Math.floor(mon / 12) + 'y ago';
  }

  function getUsernameFromPath() {
    var match = window.location.pathname.match(/^\/@([a-zA-Z0-9_]+)/);
    return match ? match[1] : null;
  }

  function hexToRgbString(hex) {
    var r = parseInt(hex.substr(1, 2), 16);
    var g = parseInt(hex.substr(3, 2), 16);
    var b = parseInt(hex.substr(5, 2), 16);
    return r + ', ' + g + ', ' + b;
  }

  var currentUser = null;

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;

    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();
      currentUser = data.user;

      if (data.user) {
        var userChip = document.createElement('a');
        userChip.className = 'action-chip';
        userChip.href = '/@' + data.user.username;
        userChip.textContent = data.user.display_name || data.user.username;

        var logoutBtn = document.createElement('a');
        logoutBtn.className = 'action-chip accent';
        logoutBtn.href = '#';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          await fetch('/api/auth?action=logout', { method: 'POST' });
          window.location.href = '/';
        });

        actions.appendChild(userChip);
        actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a');
        loginLink.className = 'action-chip';
        loginLink.href = '/login';
        loginLink.textContent = 'Log In';

        var signupLink = document.createElement('a');
        signupLink.className = 'action-chip accent';
        signupLink.href = '/signup';
        signupLink.textContent = 'Sign Up';

        actions.appendChild(loginLink);
        actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  (async function () {
    var main = document.getElementById('main');
    var username = getUsernameFromPath();

    if (!username) {
      main.innerHTML = '<div class="loading">Invalid profile URL</div>';
      return;
    }

    try {
      var res = await fetch('/api/users?username=' + encodeURIComponent(username));
      var data = await res.json();

      if (!res.ok) {
        main.innerHTML =
          '<a class="back-link" href="/">← Back to home</a>' +
          '<div class="empty-section">' + esc(data.error || 'User not found') + '</div>';
        return;
      }

      var user = data.user;
      var votes = data.votes || [];
      var comments = data.comments || [];
      var counts = data.counts || { comments: 0, votes: 0 };

      var displayName = user.display_name || user.username;
      var isOwnProfile = currentUser && currentUser.username === user.username;

      var accent = user.accent_color || '#ff9900';
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--accent-rgb', hexToRgbString(accent));

      document.title = displayName + ' (@' + user.username + ') — PhonkHub';

      var commentsCountHtml = counts.comments > 0 ? '<span class="tab-count">' + counts.comments + '</span>' : '';
      var votesCountHtml = counts.votes > 0 ? '<span class="tab-count">' + counts.votes + '</span>' : '';

      var commentsHtml;
      if (comments.length === 0) {
        commentsHtml = '<div class="empty-section">No comments yet</div>';
      } else {
        commentsHtml = comments.map(function (c) {
          return (
            '<div class="post-item">' +
              '<div class="post-context">on <a href="/track-' + c.track_id + '">' + esc(c.track_title) + '</a></div>' +
              '<div class="post-body">' + esc(c.body) + '</div>' +
              '<div class="post-time">' + timeAgo(c.created_at) + '</div>' +
            '</div>'
          );
        }).join('');
      }

      var votesHtml;
      if (votes.length === 0) {
        votesHtml = '<div class="empty-section">No votes yet</div>';
      } else {
        votesHtml = votes.map(function (v) {
          var arrow = v.value > 0 ? '▲' : '▼';
          var cls = v.value > 0 ? 'up' : 'down';
          return (
            '<a class="vote-item" href="/track-' + v.id + '">' +
              '<div class="vote-arrow ' + cls + '">' + arrow + '</div>' +
              '<div class="vote-info">' +
                '<div class="vote-title">' + esc(v.title) + '</div>' +
                '<div class="vote-artist">' + esc(v.artist) + '</div>' +
              '</div>' +
              '<div class="vote-time">' + timeAgo(v.voted_at) + '</div>' +
            '</a>'
          );
        }).join('');
      }

      var aboutHtml = '';

      if (user.bio) {
        aboutHtml += '<div class="bio-box">' + esc(user.bio) + '</div>';
      }

      if (user.socials && Object.keys(user.socials).length > 0) {
        var socialHtml = Object.keys(user.socials).map(function (key) {
          var value = user.socials[key];
          var label = PLATFORM_LABELS[key] || key;
          var href = socialHref(key, value);

          if (href) {
            return (
              '<a class="social-link" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
                '<span class="platform">' + label + '</span>' +
                '<span class="value">' + esc(value) + '</span>' +
              '</a>'
            );
          } else {
            return (
              '<span class="social-link">' +
                '<span class="platform">' + label + '</span>' +
                '<span class="value">' + esc(value) + '</span>' +
              '</span>'
            );
          }
        }).join('');

        aboutHtml += '<div class="socials-list">' + socialHtml + '</div>';
      }

      aboutHtml +=
        '<div class="about-row">' +
          '<div class="about-label">Joined</div>' +
          '<div class="about-value">' + formatDate(user.created_at) + '</div>' +
        '</div>' +
        '<div class="about-row">' +
          '<div class="about-label">Comments</div>' +
          '<div class="about-value">' + counts.comments + '</div>' +
        '</div>' +
        '<div class="about-row">' +
          '<div class="about-label">Votes Cast</div>' +
          '<div class="about-value">' + counts.votes + '</div>' +
        '</div>';

      if (!user.bio && (!user.socials || Object.keys(user.socials).length === 0)) {
        aboutHtml =
          '<div class="empty-section" style="margin-bottom: 1rem;">No bio or social links yet</div>' +
          aboutHtml;
      }

      var editBtnHtml = isOwnProfile
        ? '<a class="edit-profile-btn" href="/edit-profile">Edit Profile</a>'
        : '';

      main.innerHTML =
        '<a class="back-link" href="/">← Back to home</a>' +
        '<div class="profile-box">' +
          '<div class="banner"></div>' +
          '<div class="profile-body">' +
            editBtnHtml +
            '<div class="avatar">' + esc(displayName.charAt(0).toUpperCase()) + '</div>' +
            '<div class="display-name">' + esc(displayName) + '</div>' +
            '<div class="handle">@' + esc(user.username) + '</div>' +
            '<div class="joined">Joined ' + formatDate(user.created_at) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tabs">' +
          '<button class="tab active" data-tab="comments">Comments' + commentsCountHtml + '</button>' +
          '<button class="tab" data-tab="votes">Votes' + votesCountHtml + '</button>' +
          '<button class="tab" data-tab="about">About</button>' +
        '</div>' +
        '<div class="tab-panel active" data-panel="comments">' + commentsHtml + '</div>' +
        '<div class="tab-panel" data-panel="votes">' + votesHtml + '</div>' +
        '<div class="tab-panel" data-panel="about">' + aboutHtml + '</div>';

      var tabs = main.querySelectorAll('.tab');
      var panels = main.querySelectorAll('.tab-panel');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          panels.forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          var panel = main.querySelector('.tab-panel[data-panel="' + tab.getAttribute('data-tab') + '"]');
          if (panel) panel.classList.add('active');
        });
      });
    } catch (err) {
      main.innerHTML = '<div class="loading">Could not load profile</div>';
    }
  })();
</script>
</body>
</html>
