<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
    --accent: #ff9900;
    --accent-rgb: 255, 153, 0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-group {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    justify-self: start;
  }

  .brand-lockup { display: inline-flex; align-items: center; }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.15rem;
    height: 2.15rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.35), rgba(64, 78, 237, 0.35));
    border: 1px solid rgba(88, 101, 242, 0.35);
    color: #fff;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .discord-btn:hover {
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(64, 78, 237, 0.5));
    transform: translateY(-1px);
  }
  .discord-btn svg {
    width: 1.25rem;
    height: 1.25rem;
    display: block;
  }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent {
    background: var(--red);
    border-color: var(--red);
    color: #080808;
  }

  .primary-nav { border-top: 1px solid #181818; width: 100%; }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 3rem);
    overflow-x: auto;
    padding: 0 1.25rem;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .nav-link {
    position: relative;
    flex: 0 0 auto;
    padding: 0.75rem 0.1rem 0.68rem;
    color: #d4d4d4;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--red); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    width: 100%;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--red); }

  .profile-box {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), transparent 55%),
      rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--accent);
    border-radius: 2px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .banner {
    height: 160px;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.35), transparent 60%),
      linear-gradient(160deg, #181818, #0a0a0a);
    position: relative;
    border-bottom: 1px solid #1d1d1d;
    overflow: hidden;
  }

  .profile-body {
    padding: 0 1.75rem 1.75rem;
    position: relative;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #0a0a0a;
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--accent);
    margin-top: -48px;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .display-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.15rem;
    color: var(--white);
  }

  .handle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 0.35rem;
  }

  .joined {
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Stats Row */
  .profile-stats {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
  }
  .stat-link {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .stat-link:hover { color: var(--white); }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: var(--accent);
    line-height: 1;
  }

  /* Follow Button */
  .follow-btn {
    position: absolute;
    top: 3.5rem;
    right: 1.75rem;
    padding: 0.55rem 1.2rem;
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .follow-btn:hover { opacity: 0.85; }
  .follow-btn.following {
    background: transparent;
    color: var(--white);
    border-color: #444;
  }
  .follow-btn.following:hover {
    border-color: #ff5555;
    color: #ff5555;
  }
  .follow-btn:disabled { opacity: 0.5; cursor: wait; }

  .edit-profile-btn {
    position: absolute;
    top: 3.5rem;
    right: 1.75rem;
    padding: 0.55rem 1.1rem;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #444;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
    backdrop-filter: blur(4px);
  }
  .edit-profile-btn:hover { border-color: var(--accent); color: var(--accent); }

  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #1d1d1d;
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }

  .tab {
    flex: 0 0 auto;
    padding: 0.9rem 1.4rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: #888;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--white); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-count {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.05rem 0.4rem;
    background: #1a1a1a;
    border-radius: 999px;
    font-size: 0.6rem;
    color: #999;
    letter-spacing: 0.05em;
  }
  .tab.active .tab-count {
    background: rgba(var(--accent-rgb), 0.15);
    color: var(--accent);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .empty-section {
    padding: 2rem 1rem;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    border: 1px dashed #1d1d1d;
    border-radius: 2px;
  }

  .post-item {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.06), transparent 60%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.5rem;
  }

  .post-context {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 0.5rem;
  }
  .post-context a {
    color: var(--accent);
    text-decoration: none;
  }
  .post-context a:hover { text-decoration: underline; }

  .post-body {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #ddd;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 0.5rem;
  }

  .post-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
  }

  .vote-item {
    display: grid;
    grid-template-columns: 2.5rem 1fr auto;
    gap: 0.9rem;
    align-items: center;
    padding: 0.7rem 0.9rem;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.05), transparent 65%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    margin-bottom: 0.4rem;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .vote-item:hover {
    border-color: var(--accent);
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.1), transparent 65%),
      rgba(20, 20, 20, 0.95);
  }

  .vote-arrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    line-height: 1;
    text-align: center;
  }
  .vote-arrow.up { color: var(--accent); }
  .vote-arrow.down { color: #ff7777; }

  .vote-info { min-width: 0; }
  .vote-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vote-artist {
    font-size: 0.68rem;
    color: #999;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .vote-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
    white-space: nowrap;
  }

  .bio-box {
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.08), transparent 65%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #1d1d1d;
    border-radius: 2px;
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    line-height: 1.55;
    color: #ddd;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .socials-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .social-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    background:
      linear-gradient(135deg, rgba(var(--accent-rgb), 0.05), transparent 70%),
      rgba(13, 13, 13, 0.85);
    border: 1px solid #2a2a2a;
    border-radius: 2px;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .social-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .social-link .platform {
    color: #888;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
  }
  .social-link .value {
    color: inherit;
    text-transform: none;
    letter-spacing: 0.03em;
    font-weight: 600;
  }

  .about-row {
    display: flex;
    justify-content: space-between;
    padding: 0.9rem 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .about-row:last-child { border-bottom: none; }

  .about-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
  }

  .about-value {
    font-size: 0.9rem;
    color: var(--white);
    text-align: right;
  }

  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  /* Modal CSS */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--accent);
    border-radius: 2px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    max-height: 80vh;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #1d1d1d;
  }
  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white);
  }
  .modal-close {
    background: none;
    border: none;
    color: #888;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--red); }
  .modal-body {
    padding: 0.5rem;
    overflow-y: auto;
  }
  .user-list-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    border-radius: 2px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .user-list-item:hover { background: #1a1a1a; }
  .user-list-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #111;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    color: var(--accent);
    flex-shrink: 0;
  }
  .user-list-info { min-width: 0; }
  .user-list-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--white);
    text-transform: uppercase;
  }
  .user-list-handle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .user-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid #333;
    padding: 0.15rem 0.25rem; /* Made the padding slightly smaller */
    border-radius: 4px;
    line-height: 0; /* Fixes weird gaps inside the box */
  }

  .user-badge img {
    width: 1em; /* Made it exactly the same height as the text */
    height: 1em;
    display: block;
    object-fit: contain;
  }

  /* NOTIFICATION CSS */
  .notif-wrapper { position: relative; display: inline-block; }
  .notif-btn { background: transparent; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0.4rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s; position: relative; }
  .notif-btn:hover { color: var(--white); }
  .notif-badge { position: absolute; top: 0; right: 0; background: var(--red); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; font-weight: 700; padding: 0.1rem 0.3rem; border-radius: 999px; transform: translate(25%, -25%); display: none; }
  .notif-badge.show { display: block; }
  .notif-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 320px; background: #0d0d0d; border: 1px solid #2a2a2a; border-top: 3px solid var(--red); border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 1000; max-height: 400px; overflow-y: auto; }
  .notif-dropdown.open { display: block; }
  .notif-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a1a; background: #050505; }
  .notif-header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); }
  .notif-mark-read { background: none; border: none; color: var(--red); font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; letter-spacing: 0.05em; cursor: pointer; }
  .notif-mark-read:hover { text-decoration: underline; }
  .notif-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #1a1a1a; text-decoration: none; transition: background 0.15s; }
  .notif-item:hover { background: #1a1a1a; }
  .notif-item.unread { background: rgba(255, 153, 0, 0.05); }
  .notif-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1a1a1a; color: #888; flex-shrink: 0; font-size: 0.8rem; }
  .notif-item.unread .notif-icon { background: var(--red); color: #000; }
  .notif-text { font-family: 'Barlow', sans-serif; font-size: 0.85rem; color: #ddd; line-height: 1.4; }
  .notif-text strong { color: var(--white); font-weight: 600; }
  .notif-time { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; color: #666; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .notif-empty { padding: 2rem 1rem; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }

  footer {
    background: #000;
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: #ccc;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.68rem, 1.4vw, 0.82rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }

  /* UPDATED MOBILE HEADER FIX */
  @media (max-width: 780px) {
    .header-main { 
      grid-template-columns: 1fr auto; 
      gap: 0.5rem; 
      padding: 0.65rem 0.75rem;
    }
    .brand-group { grid-column: 1; grid-row: 1; }
    .header-actions { grid-column: 2; grid-row: 1; justify-self: end; gap: 0.35rem; }
    
    .search-box { 
      grid-column: 1 / -1; 
      grid-row: 2; 
      max-width: none; 
      justify-self: stretch; 
      margin-top: 0.25rem;
    }
    
    .action-chip { padding: 0.35rem 0.55rem; font-size: 0.62rem; }
    
    .notif-dropdown {
      position: fixed;
      top: 60px; 
      left: 10px;
      right: 10px;
      width: auto;
      max-width: none;
    }
  }

  @media (max-width: 480px) {
    .header-main { padding: 0.65rem 0.75rem; }
    .profile-body { padding: 0 1rem 1.5rem; }
    .avatar { width: 80px; height: 80px; font-size: 2rem; margin-top: -40px; }
    .display-name { font-size: 1.4rem; }
    .vote-item { grid-template-columns: 2rem 1fr auto; gap: 0.5rem; padding: 0.6rem 0.7rem; }
    .edit-profile-btn, .follow-btn { top: 3rem; right: 1rem; padding: 0.45rem 0.8rem; font-size: 0.62rem; }
    .profile-stats { gap: 1rem; }
  }
</style>
</head>

<body>
  <header>
    <div class="header-main">
      <div class="brand-group">
        <a class="brand-lockup" href="/" aria-label="PhonkHub home">
          <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
        </a>
        <a class="discord-btn" href="https://discord.gg/b7gQNCpjy4" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord" title="Join our Discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
        </a>
      </div>
      <div></div>
      <div class="header-actions" id="headerActions"></div>
    </div>

    <nav class="primary-nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/forums">Forums</a>
        <a class="nav-link">About</a>
        <a class="nav-link">All Tracks</a>
        <a class="nav-link">Genres</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <div class="loading">Loading…</div>
  </main>

  <footer>
    <p>
      <span class="tagline">New Tracks Added Periodically</span><br />&nbsp;<br />
      &copy; 2026 PhonkHub &nbsp;·&nbsp; Property Of ¥GoyMafia¥&trade; &nbsp;·&nbsp; All Rights To The Respective Artists
    </p>
  </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="userListModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Followers</div>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

<script>
  // ---- Notification System ----
  (async function () {
    var actionsEl = document.getElementById('headerActions');
    if (!actionsEl) return;
    try {
      var authRes = await fetch('/api/auth?action=me');
      var authData = await authRes.json();
      if (!authData.user) return;

      var wrapper = document.createElement('div');
      wrapper.className = 'notif-wrapper';
      wrapper.innerHTML = `
        <button class="notif-btn" id="notifBtn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-header">
            <span class="notif-header-title">Notifications</span>
            <button class="notif-mark-read" id="markReadBtn">Mark all as read</button>
          </div>
          <div id="notifList"></div>
        </div>
      `;
      actionsEl.insertBefore(wrapper, actionsEl.firstChild);

      var btn = document.getElementById('notifBtn');
      var dropdown = document.getElementById('notifDropdown');
      var badge = document.getElementById('notifBadge');
      var list = document.getElementById('notifList');
      var markReadBtn = document.getElementById('markReadBtn');

      btn.addEventListener('click', function (e) { e.stopPropagation(); dropdown.classList.toggle('open'); });
      document.addEventListener('click', function (e) { if (!wrapper.contains(e.target)) dropdown.classList.remove('open'); });

      async function loadNotifications() {
        try {
          var res = await fetch('/api/notifications');
          if (!res.ok) return;
          var data = await res.json();
          if (data.unreadCount > 0) { badge.textContent = data.unreadCount > 9 ? '9+' : data.unreadCount; badge.classList.add('show'); } else { badge.classList.remove('show'); }
          if (data.notifications.length === 0) { list.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }

          var icons = { follow: '👤', reply: '💬', mention: '@' };
          list.innerHTML = data.notifications.map(function(n) {
            var isUnread = !n.is_read;
            var actorName = n.actor_display_name || n.actor_username;
            var text = n.type === 'follow' ? '<strong>' + actorName + '</strong> followed you' : n.type === 'reply' ? '<strong>' + actorName + '</strong> replied to your comment' : '<strong>' + actorName + '</strong> mentioned you';
            var mins = Math.floor((Date.now() - new Date(n.created_at).getTime()) / 60000);
            var timeStr = mins < 60 ? mins + 'm ago' : Math.floor(mins/60) + 'h ago';

            return `<a href="${n.link}" class="notif-item ${isUnread ? 'unread' : ''}"><div class="notif-icon">${icons[n.type] || '🔔'}</div><div class="notif-text">${text}<span class="notif-time">${timeStr}</span></div></a>`;
          }).join('');
        } catch (err) {}
      }
      markReadBtn.addEventListener('click', async function() { await fetch('/api/notifications?action=read-all', { method: 'POST' }); loadNotifications(); });
      loadNotifications();
      setInterval(loadNotifications, 30000);
    } catch (err) {}
  })();

  var PLATFORM_LABELS = { discord: 'Discord', youtube: 'YouTube', soundcloud: 'SoundCloud', twitter: 'Twitter', instagram: 'Instagram', spotify: 'Spotify' };

  function socialHref(platform, value) {
    var v = value.trim();
    if (/^https?:\/\//i.test(v)) return v;
    switch (platform) {
      case 'discord': return null;
      case 'youtube': return 'https://youtube.com/' + (v.startsWith('@') ? v : '@' + v);
      case 'soundcloud': return 'https://soundcloud.com/' + v.replace(/^@/, '');
      case 'twitter': return 'https://x.com/' + v.replace(/^@/, '');
      case 'instagram': return 'https://instagram.com/' + v.replace(/^@/, '');
      case 'spotify': return 'https://open.spotify.com/user/' + v.replace(/^@/, '');
      default: return null;
    }
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function formatDate(iso) {
    var d = new Date(iso);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
  }

  function timeAgo(iso) {
    var then = new Date(iso).getTime(), now = Date.now(), sec = Math.floor((now - then) / 1000);
    if (sec < 5) return 'just now'; if (sec < 60) return sec + 's ago';
    var min = Math.floor(sec / 60); if (min < 60) return min + 'm ago';
    var hr = Math.floor(min / 60); if (hr < 24) return hr + 'h ago';
    var day = Math.floor(hr / 24); if (day < 30) return day + 'd ago';
    var mon = Math.floor(day / 30); if (mon < 12) return mon + 'mo ago';
    return Math.floor(mon / 12) + 'y ago';
  }

  function getUsernameFromPath() { var match = window.location.pathname.match(/^\/@([a-zA-Z0-9_]+)/); return match ? match[1] : null; }
  function hexToRgbString(hex) { var r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16); return r + ', ' + g + ', ' + b; }

  var currentUser = null;

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;
    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();
      currentUser = data.user;
      if (data.user) {
        var userChip = document.createElement('a'); userChip.className = 'action-chip'; userChip.href = '/@' + data.user.username; userChip.textContent = data.user.display_name || data.user.username;
        var logoutBtn = document.createElement('a'); logoutBtn.className = 'action-chip accent'; logoutBtn.href = '#'; logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) { e.preventDefault(); await fetch('/api/auth?action=logout', { method: 'POST' }); window.location.href = '/'; });
        actions.appendChild(userChip); actions.appendChild(logoutBtn);
      } else {
        var loginLink = document.createElement('a'); loginLink.className = 'action-chip'; loginLink.href = '/login'; loginLink.textContent = 'Log In';
        var signupLink = document.createElement('a'); signupLink.className = 'action-chip accent'; signupLink.href = '/signup'; signupLink.textContent = 'Sign Up';
        actions.appendChild(loginLink); actions.appendChild(signupLink);
      }
    } catch (err) {}
  })();

  var modal = document.getElementById('userListModal');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');

  function closeModal() { modal.classList.remove('open'); }
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

  async function openModal(type, username) {
    modalTitle.textContent = type === 'followers' ? 'Followers' : 'Following';
    modalBody.innerHTML = '<div style="padding: 1rem; text-align: center; color: #888;">Loading…</div>';
    modal.classList.add('open');
    try {
      var res = await fetch('/api/follow?action=' + type + '&username=' + encodeURIComponent(username));
      var data = await res.json();
      if (!res.ok) throw new Error('Failed to load');
      if (data.users.length === 0) {
        modalBody.innerHTML = '<div style="padding: 2rem 1rem; text-align: center; color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;">No users yet</div>';
        return;
      }
      modalBody.innerHTML = data.users.map(function(u) {
        var displayName = u.display_name || u.username;
        var initial = displayName.charAt(0).toUpperCase();
        return '<a href="/@' + esc(u.username) + '" class="user-list-item"><div class="user-list-avatar">' + initial + '</div><div class="user-list-info"><div class="user-list-name">' + esc(displayName) + '</div><div class="user-list-handle">@' + esc(u.username) + '</div></div></a>';
      }).join('');
    } catch (err) {
      modalBody.innerHTML = '<div style="padding: 1rem; text-align: center; color: #ff5555;">Error loading list</div>';
    }
  }

  (async function () {
    var main = document.getElementById('main');
    var username = getUsernameFromPath();
    if (!username) { main.innerHTML = '<div class="loading">Invalid profile URL</div>'; return; }

    // Ensure currentUser is known before rendering (avoids follow button race condition)
    if (!currentUser) {
      try {
        var meRes = await fetch('/api/auth?action=me');
        var meData = await meRes.json();
        currentUser = meData.user;
      } catch (e) {}
    }

    try {
      var res = await fetch('/api/users?username=' + encodeURIComponent(username));
      var data = await res.json();
      if (!res.ok) { main.innerHTML = '<a class="back-link" href="/">← Back to home</a><div class="empty-section">' + esc(data.error || 'User not found') + '</div>'; return; }

      var user = data.user, votes = data.votes || [], comments = data.comments || [], counts = data.counts || { comments: 0, votes: 0 };
      var displayName = user.display_name || user.username;
      var isOwnProfile = currentUser && currentUser.username === user.username;
      var accent = user.accent_color || '#ff9900';
      var badgeHtml = '';
      if (user.is_admin === 1) {
        badgeHtml = `<span class="user-badge"><img src="https://cdn3.emoji.gg/emojis/905144-adminroleicon.png" alt="Admin" title="PhonkHub Admin"></span>`;
      } else if (user.is_booster === 1) {
        badgeHtml = `<span class="user-badge"><img src="https://cdn3.emoji.gg/emojis/5611-evolving-badge-nitro-15-months.png" alt="Booster" title="PhonkHub Booster"></span>`;
      }

      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--accent-rgb', hexToRgbString(accent));
      document.title = displayName + ' (@' + user.username + ') — PhonkHub';

      var commentsCountHtml = counts.comments > 0 ? '<span class="tab-count">' + counts.comments + '</span>' : '';
      var votesCountHtml = counts.votes > 0 ? '<span class="tab-count">' + counts.votes + '</span>' : '';

      var commentsHtml = comments.length === 0 ? '<div class="empty-section">No comments yet</div>' : comments.map(function (c) {
        return '<div class="post-item"><div class="post-context">on <a href="/track-' + c.track_id + '">' + esc(c.track_title) + '</a></div><div class="post-body">' + esc(c.body) + '</div><div class="post-time">' + timeAgo(c.created_at) + '</div></div>';
      }).join('');

      var votesHtml = votes.length === 0 ? '<div class="empty-section">No votes yet</div>' : votes.map(function (v) {
        var arrow = v.value > 0 ? '▲' : '▼', cls = v.value > 0 ? 'up' : 'down';
        return '<a class="vote-item" href="/track-' + v.id + '"><div class="vote-arrow ' + cls + '">' + arrow + '</div><div class="vote-info"><div class="vote-title">' + esc(v.title) + '</div><div class="vote-artist">' + esc(v.artist) + '</div></div><div class="vote-time">' + timeAgo(v.voted_at) + '</div></a>';
      }).join('');

      var aboutHtml = '';
      if (user.bio) aboutHtml += '<div class="bio-box">' + esc(user.bio) + '</div>';
      if (user.socials && Object.keys(user.socials).length > 0) {
        var socialHtml = Object.keys(user.socials).map(function (key) {
          var value = user.socials[key], label = PLATFORM_LABELS[key] || key, href = socialHref(key, value);
          if (href) return '<a class="social-link" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"><span class="platform">' + label + '</span><span class="value">' + esc(value) + '</span></a>';
          else return '<span class="social-link"><span class="platform">' + label + '</span><span class="value">' + esc(value) + '</span></span>';
        }).join('');
        aboutHtml += '<div class="socials-list">' + socialHtml + '</div>';
      }

      aboutHtml += '<div class="about-row"><div class="about-label">Joined</div><div class="about-value">' + formatDate(user.created_at) + '</div></div><div class="about-row"><div class="about-label">Comments</div><div class="about-value">' + counts.comments + '</div></div><div class="about-row"><div class="about-label">Votes Cast</div><div class="about-value">' + counts.votes + '</div></div>';

      if (!user.bio && (!user.socials || Object.keys(user.socials).length === 0)) aboutHtml = '<div class="empty-section" style="margin-bottom: 1rem;">No bio or social links yet</div>' + aboutHtml;

   var bannerStyle = user.banner_url ? ' style="background-image: url(\'' + user.banner_url + '\'); background-size: cover; background-position: center;"' : '';
   var avatarStyle = user.avatar_url ? ' style="background-image: url(\'' + user.avatar_url + '\'); background-size: cover; background-position: center; color: transparent;"' : '';

      var actionBtnHtml = '';
      if (isOwnProfile) {
        actionBtnHtml = '<a class="edit-profile-btn" href="/edit-profile">Edit Profile</a>';
      } else if (currentUser) {
        var followClass = user.is_following ? ' following' : '', followText = user.is_following ? 'Following' : 'Follow';
        actionBtnHtml = '<button class="follow-btn' + followClass + '" id="followBtn" data-id="' + user.id + '" data-state="' + (user.is_following ? '1' : '0') + '">' + followText + '</button>';
      }

      main.innerHTML =
        '<a class="back-link" href="/">← Back to home</a>' +
        '<div class="profile-box">' +
          '<div class="banner"' + bannerStyle + '></div>' +
          '<div class="profile-body">' +
            actionBtnHtml +
            '<div class="avatar"' + avatarStyle + '>' + esc(displayName.charAt(0).toUpperCase()) + '</div>' +
            '<div class="display-name" style="display: flex; align-items: center; gap: 0.2rem; flex-wrap: wrap;">' + esc(displayName) + badgeHtml + '</div>' +
            '<div class="handle">@' + esc(user.username) + '</div>' +
            '<div class="profile-stats">' +
              '<button class="stat-link" onclick="openModal(\'followers\', \'' + esc(user.username) + '\')"><span class="stat-num" id="followerCount">' + user.follower_count + '</span> Followers</button>' +
              '<button class="stat-link" onclick="openModal(\'following\', \'' + esc(user.username) + '\')"><span class="stat-num">' + user.following_count + '</span> Following</button>' +
            '</div>' +
            '<div class="joined" style="margin-top: 0.5rem;">Joined ' + formatDate(user.created_at) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tabs">' +
          '<button class="tab active" data-tab="comments">Comments' + commentsCountHtml + '</button>' +
          '<button class="tab" data-tab="votes">Votes' + votesCountHtml + '</button>' +
          '<button class="tab" data-tab="about">About</button>' +
        '</div>' +
        '<div class="tab-panel active" data-panel="comments">' + commentsHtml + '</div>' +
        '<div class="tab-panel" data-panel="votes">' + votesHtml + '</div>' +
        '<div class="tab-panel" data-panel="about">' + aboutHtml + '</div>';

      var followBtn = document.getElementById('followBtn');
      if (followBtn) {
        followBtn.addEventListener('click', async function () {
          var targetId = parseInt(this.getAttribute('data-id'), 10), isFollowing = this.getAttribute('data-state') === '1';
          this.disabled = true;
          try {
            var res = await fetch('/api/follow?action=toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target_id: targetId }) });
            var data = await res.json();
            if (!res.ok) { alert(data.error || 'Failed to follow'); this.disabled = false; return; }
            if (data.following) { this.classList.add('following'); this.textContent = 'Following'; this.setAttribute('data-state', '1'); }
            else { this.classList.remove('following'); this.textContent = 'Follow'; this.setAttribute('data-state', '0'); }
            document.getElementById('followerCount').textContent = data.followerCount;
          } catch (err) { alert('Network error'); }
          this.disabled = false;
        });
      }

      var tabs = main.querySelectorAll('.tab'), panels = main.querySelectorAll('.tab-panel');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); }); panels.forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          var panel = main.querySelector('.tab-panel[data-panel="' + tab.getAttribute('data-tab') + '"]');
          if (panel) panel.classList.add('active');
        });
      });
    } catch (err) { main.innerHTML = '<div class="loading">Could not load profile</div>'; }
  })();
</script>
</body>
</html>
