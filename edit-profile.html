<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — PhonkHub</title>
<link rel="icon" type="image/png" href="https://ei.phncdn.com/www-static/favicon.ico?cache=2026050702">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #ff9900;
    --red-dim: #cb7603;
    --white: #f0ece4;
    --gray: #888;
    --border: #222;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    position: relative;
    background: #050505;
    border-bottom: 1px solid #242424;
  }

  .header-main {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.15rem;
    padding: 0.75rem 1.25rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .brand-group {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    justify-self: start;
  }

  .brand-lockup { display: inline-flex; align-items: center; }

  .discord-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.15rem;
    height: 2.15rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.35), rgba(64, 78, 237, 0.35));
    border: 1px solid rgba(88, 101, 242, 0.35);
    color: #fff;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .discord-btn:hover {
    background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(64, 78, 237, 0.5));
    transform: translateY(-1px);
  }
  .discord-btn svg {
    width: 1.25rem;
    height: 1.25rem;
    display: block;
  }

  #logo {
    display: block;
    width: clamp(8rem, 14vw, 11.5rem);
    height: auto;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    justify-self: end;
  }

  .action-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.15rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid #383838;
    border-radius: 999px;
    color: #ddd;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }
  .action-chip.accent {
    background: var(--red);
    border-color: var(--red);
    color: #080808;
  }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    width: 100%;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #999;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    margin-bottom: 1.25rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--red); }

  .box {
    background: rgba(13, 13, 13, 0.95);
    border: 1px solid #2a2a2a;
    border-top: 3px solid var(--red);
    border-radius: 2px;
    padding: 1.75rem;
  }

  .box h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    text-align: center;
  }

  .box .sub {
    text-align: center;
    color: #888;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1.75rem;
  }

  label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 0.3rem;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--red-dim); }
  textarea { resize: vertical; min-height: 80px; }

  .form-group { margin-bottom: 1.25rem; }

  .char-count {
    text-align: right;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: #666;
    margin-top: 0.3rem;
  }
  .char-count.over { color: #ff5555; }

  .section-divider {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--red);
    padding: 1.25rem 0 0.75rem;
    border-top: 1px solid #1a1a1a;
    margin-top: 0.5rem;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .color-swatch {
    width: 50px;
    height: 50px;
    border-radius: 4px;
    border: 2px solid #333;
    cursor: pointer;
    padding: 0;
    background: none;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .color-swatch input[type="color"] {
    position: absolute;
    inset: -10px;
    width: calc(100% + 20px);
    height: calc(100% + 20px);
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .color-text {
    flex: 1;
    max-width: 160px;
    padding: 0.7rem 0.9rem;
    background: #080808;
    border: 1px solid #2a2a2a;
    color: var(--white);
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
    text-transform: lowercase;
  }
  .color-text:focus { border-color: var(--red-dim); }
  .color-text.invalid { border-color: #ff5555; }

  .color-presets {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .color-preset {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #2a2a2a;
    cursor: pointer;
    padding: 0;
    transition: border-color 0.2s, transform 0.15s;
  }
  .color-preset:hover {
    border-color: #fff;
    transform: scale(1.1);
  }

  .color-hint {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: #666;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }
  .color-hint.err { color: #ff5555; }

  .social-row { margin-bottom: 1rem; }
  .social-row label { display: flex; align-items: center; gap: 0.4rem; }

  .social-dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: #333;
    display: inline-block;
  }
  .social-row.filled .social-dot { background: var(--red); }

  .save-btn {
    width: 100%;
    padding: 0.85rem 1rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #080808;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
    border-radius: 2px;
    margin-top: 1.5rem;
  }
  .save-btn:hover { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.4; cursor: wait; }

  .status {
    margin-top: 1rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    min-height: 1rem;
  }
  .status.ok { color: #6fdd6f; }
  .status.err { color: #ff5555; }

  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--gray);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  @media (max-width: 480px) {
    .header-main { padding: 0.65rem 0.75rem; }
    .box { padding: 1.25rem 1rem; }
  }

    /* NOTIFICATION CSS */
  .notif-wrapper { position: relative; display: inline-block; }
  .notif-btn { background: transparent; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0.4rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s; position: relative; }
  .notif-btn:hover { color: var(--white); }
  .notif-badge { position: absolute; top: 0; right: 0; background: var(--red); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; font-weight: 700; padding: 0.1rem 0.3rem; border-radius: 999px; transform: translate(25%, -25%); display: none; }
  .notif-badge.show { display: block; }
  .notif-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 320px; background: #0d0d0d; border: 1px solid #2a2a2a; border-top: 3px solid var(--red); border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 1000; max-height: 400px; overflow-y: auto; }
  .notif-dropdown.open { display: block; }
  .notif-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #1a1a1a; background: #050505; }
  .notif-header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); }
  .notif-mark-read { background: none; border: none; color: var(--red); font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; letter-spacing: 0.05em; cursor: pointer; }
  .notif-mark-read:hover { text-decoration: underline; }
  .notif-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #1a1a1a; text-decoration: none; transition: background 0.15s; }
  .notif-item:hover { background: #1a1a1a; }
  .notif-item.unread { background: rgba(255, 153, 0, 0.05); }
  .notif-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1a1a1a; color: #888; flex-shrink: 0; font-size: 0.8rem; }
  .notif-item.unread .notif-icon { background: var(--red); color: #000; }
  .notif-text { font-family: 'Barlow', sans-serif; font-size: 0.85rem; color: #ddd; line-height: 1.4; }
  .notif-text strong { color: var(--white); font-weight: 600; }
  .notif-time { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; color: #666; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .notif-empty { padding: 2rem 1rem; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }

</style>
</head>

<body>
  <header>
    <div class="header-main">
      <div class="brand-group">
        <a class="brand-lockup" href="/" aria-label="PhonkHub home">
          <img id="logo" src="https://i.ibb.co/FbnNpjpp/phonk-Hub.png" alt="PhonkHub Logo" />
        </a>
        <a class="discord-btn" href="https://discord.gg/b7gQNCpjy4" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord" title="Join our Discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
        </a>
      </div>
      <div></div>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <main id="main">
    <div class="loading">Loading…</div>
  </main>

<script>
  var MAX_BIO = 200;
  var MAX_DISPLAY = 40;
  var DEFAULT_ACCENT = '#ff9900';

  var PRESET_COLORS = [
    '#ff9900', '#ff3d3d', '#ff5fa2', '#c77dff', '#7b8cff',
    '#3dc6ff', '#3dff9b', '#c7ff3d', '#ffb13d', '#ff7a3d',
  ];

  var PLATFORMS = [
    { key: 'discord', label: 'Discord' },
    { key: 'youtube', label: 'YouTube' },
    { key: 'soundcloud', label: 'SoundCloud' },
    { key: 'twitter', label: 'Twitter / X' },
    { key: 'instagram', label: 'Instagram' },
    { key: 'spotify', label: 'Spotify' },
  ];

  var state = {
    accent_color: DEFAULT_ACCENT,
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function validateAccent(hex) {
    if (typeof hex !== 'string') return 'Invalid format';
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return 'Use format #rrggbb';

    var r = parseInt(hex.substr(1, 2), 16);
    var g = parseInt(hex.substr(3, 2), 16);
    var b = parseInt(hex.substr(5, 2), 16);

    var max = Math.max(r, g, b);
    var min = Math.min(r, g, b);
    var saturation = max === 0 ? 0 : (max - min) / max;

    if (saturation < 0.25) return 'Too grey — pick something more colorful';
    return null;
  }

  (async function () {
    var actions = document.getElementById('headerActions');
    if (!actions) return;

    try {
      var res = await fetch('/api/auth?action=me');
      var data = await res.json();

      if (data.user) {
        var userChip = document.createElement('a');
        userChip.className = 'action-chip';
        userChip.href = '/@' + data.user.username;
        userChip.textContent = data.user.display_name || data.user.username;

        var logoutBtn = document.createElement('a');
        logoutBtn.className = 'action-chip accent';
        logoutBtn.href = '#';
        logoutBtn.textContent = 'Log Out';
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          await fetch('/api/auth?action=logout', { method: 'POST' });
          window.location.href = '/';
        });

        actions.appendChild(userChip);
        actions.appendChild(logoutBtn);
      } else {
        window.location.href = '/login';
      }
    } catch (err) {}
  })();

  (async function () {
    var main = document.getElementById('main');

    try {
      var meRes = await fetch('/api/auth?action=me');
      var meData = await meRes.json();
      var myUsername = meData.user ? meData.user.username : '';

      var res = await fetch('/api/profile');
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      var data = await res.json();
      var profile = data.profile || {};

      state.accent_color = profile.accent_color || DEFAULT_ACCENT;

      var socialRowsHtml = PLATFORMS.map(function (p) {
        var value = (profile.socials && profile.socials[p.key]) || '';
        return (
          '<div class="social-row' + (value ? ' filled' : '') + '" data-platform="' + p.key + '">' +
            '<label for="s_' + p.key + '"><span class="social-dot"></span>' + p.label + '</label>' +
            '<input type="text" id="s_' + p.key + '" data-social="' + p.key + '" value="' + esc(value) + '" placeholder="your handle or URL">' +
          '</div>'
        );
      }).join('');

      var presetSwatches = PRESET_COLORS.map(function (c) {
        return '<button type="button" class="color-preset" data-preset="' + c + '" style="background:' + c + ';" title="' + c + '"></button>';
      }).join('');

      main.innerHTML =
        '<a class="back-link" href="/@' + esc(myUsername) + '">← Back to profile</a>' +
        '<div class="box">' +
          '<h1>Edit Profile</h1>' +
          '<div class="sub">Customize how you appear on PhonkHub</div>' +

          '<div class="section-divider">Theme</div>' +
          '<div class="color-row">' +
            '<button type="button" class="color-swatch" id="colorSwatch">' +
              '<input type="color" id="colorPicker" value="' + esc(state.accent_color) + '">' +
            '</button>' +
            '<input type="text" class="color-text" id="colorText" value="' + esc(state.accent_color) + '" maxlength="7">' +
          '</div>' +
          '<div class="color-presets">' + presetSwatches + '</div>' +
          '<div class="color-hint" id="colorHint">Accent color for your profile</div>' +

          // --- NEW IMAGES SECTION ---
          '<div class="section-divider">Images (Admins & Boosters)</div>' +
          
          '<div class="form-group">' +
            '<label>Avatar</label>' +
            '<div style="display: flex; gap: 10px; align-items: center;">' +
              '<div id="avatarPreview" style="width: 48px; height: 48px; border-radius: 50%; background: #222; background-size: cover; background-position: center; border: 1px solid #444;"></div>' +
              '<input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="uploadImage(this, \'avatar\')">' +
              '<button type="button" class="action-chip" onclick="document.getElementById(\'avatarUpload\').click()" style="cursor: pointer;">Upload Avatar</button>' +
            '</div>' +
          '</div>' +

          '<div class="form-group">' +
            '<label>Banner</label>' +
            '<div style="display: flex; gap: 10px; align-items: center;">' +
              '<div id="bannerPreview" style="width: 120px; height: 48px; border-radius: 4px; background: #222; background-size: cover; background-position: center; border: 1px solid #444;"></div>' +
              '<input type="file" id="bannerUpload" accept="image/*" style="display: none;" onchange="uploadImage(this, \'banner\')">' +
              '<button type="button" class="action-chip" onclick="document.getElementById(\'bannerUpload\').click()" style="cursor: pointer;">Upload Banner</button>' +
            '</div>' +
          '</div>' +
          // --- END NEW IMAGES SECTION ---

          '<div class="section-divider">Basics</div>' +

          '<div class="form-group">' +
            '<label for="display_name">Display Name</label>' +
            '<input type="text" id="display_name" maxlength="' + MAX_DISPLAY + '" value="' + esc(profile.display_name || '') + '" placeholder="Your display name">' +
          '</div>' +

          '<div class="form-group">' +
            '<label for="bio">Bio</label>' +
            '<textarea id="bio" maxlength="' + MAX_BIO + '" placeholder="Tell people about yourself...">' + esc(profile.bio || '') + '</textarea>' +
            '<div class="char-count" id="bioCount">0 / ' + MAX_BIO + '</div>' +
          '</div>' +

          '<div class="section-divider">Social Links</div>' +
          socialRowsHtml +

          '<button class="save-btn" id="saveBtn">Save Changes</button>' +
          '<div class="status" id="status"></div>' +
        '</div>';

      setTimeout(() => {
        if (profile.avatar_url) document.getElementById('avatarPreview').style.backgroundImage = `url('${profile.avatar_url}')`;
        if (profile.banner_url) document.getElementById('bannerPreview').style.backgroundImage = `url('${profile.banner_url}')`;
      }, 100);

      var colorPicker = document.getElementById('colorPicker');
      var colorText = document.getElementById('colorText');
      var colorHint = document.getElementById('colorHint');
      var colorSwatch = document.getElementById('colorSwatch');

      function applyColor(hex, updatePicker) {
        var err = validateAccent(hex);
        if (err) {
          colorHint.className = 'color-hint err';
          colorHint.textContent = err;
          colorText.classList.add('invalid');
          return;
        }
        colorHint.className = 'color-hint';
        colorHint.textContent = 'Accent color for your profile';
        colorText.classList.remove('invalid');
        state.accent_color = hex.toLowerCase();
        colorSwatch.style.background = state.accent_color;
        if (updatePicker) colorPicker.value = state.accent_color;
      }

      colorSwatch.style.background = state.accent_color;

      colorPicker.addEventListener('input', function () {
        colorText.value = this.value;
        applyColor(this.value, false);
      });

      colorText.addEventListener('input', function () {
        var v = this.value.trim();
        if (!v.startsWith('#')) v = '#' + v;
        v = v.toLowerCase();
        if (v.length === 7) {
          applyColor(v, true);
        } else {
          colorHint.className = 'color-hint';
          colorHint.textContent = 'Type a 6-digit hex code';
          colorText.classList.remove('invalid');
        }
      });

      colorText.addEventListener('blur', function () {
        var v = this.value.trim();
        if (!v.startsWith('#')) v = '#' + v;
        v = v.toLowerCase();
        if (!/^#[0-9a-f]{6}$/.test(v)) {
          this.value = state.accent_color;
          colorHint.className = 'color-hint';
          colorHint.textContent = 'Accent color for your profile';
          colorText.classList.remove('invalid');
        }
      });

      document.querySelectorAll('[data-preset]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var c = this.getAttribute('data-preset');
          colorText.value = c;
          applyColor(c, true);
        });
      });

      var bioEl = document.getElementById('bio');
      var bioCount = document.getElementById('bioCount');
      function updateBioCount() {
        var len = bioEl.value.length;
        bioCount.textContent = len + ' / ' + MAX_BIO;
        bioCount.classList.toggle('over', len > MAX_BIO);
      }
      bioEl.addEventListener('input', updateBioCount);
      updateBioCount();

      var socialInputs = document.querySelectorAll('[data-social]');
      socialInputs.forEach(function (input) {
        input.addEventListener('input', function () {
          var row = input.closest('.social-row');
          if (row) row.classList.toggle('filled', !!input.value.trim());
        });
      });

      document.getElementById('saveBtn').addEventListener('click', async function () {
        var btn = this;
        var statusEl = document.getElementById('status');

        var socials = {};
        socialInputs.forEach(function (input) {
          var val = input.value.trim();
          if (val) socials[input.getAttribute('data-social')] = val;
        });

        var payload = {
          display_name: document.getElementById('display_name').value.trim(),
          bio: bioEl.value.trim(),
          socials: socials,
          accent_color: state.accent_color,
        };

        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = 'Saving…';

        try {
          var saveRes = await fetch('/api/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          var saveData = await saveRes.json();

          if (!saveRes.ok) {
            statusEl.className = 'status err';
            statusEl.textContent = saveData.error || 'Could not save';
            btn.disabled = false;
            return;
          }

          statusEl.className = 'status ok';
          statusEl.textContent = 'Saved!';
          setTimeout(function () { statusEl.textContent = ''; }, 2500);
        } catch (err) {
          statusEl.className = 'status err';
          statusEl.textContent = 'Network error';
        }

        btn.disabled = false;
      });
    } catch (err) {
      main.innerHTML = '<div class="loading">Could not load profile</div>';
    }
  })();
</script>

<script>
  // ---- Notification System ----
  (async function () {
    var actionsEl = document.getElementById('headerActions');
    if (!actionsEl) return;
    try {
      var authRes = await fetch('/api/auth?action=me');
      var authData = await authRes.json();
      if (!authData.user) return;

      var wrapper = document.createElement('div');
      wrapper.className = 'notif-wrapper';
      wrapper.innerHTML = `
        <button class="notif-btn" id="notifBtn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-header">
            <span class="notif-header-title">Notifications</span>
            <button class="notif-mark-read" id="markReadBtn">Mark all as read</button>
          </div>
          <div id="notifList"></div>
        </div>
      `;
      actionsEl.insertBefore(wrapper, actionsEl.firstChild);

      var btn = document.getElementById('notifBtn');
      var dropdown = document.getElementById('notifDropdown');
      var badge = document.getElementById('notifBadge');
      var list = document.getElementById('notifList');
      var markReadBtn = document.getElementById('markReadBtn');

      btn.addEventListener('click', function (e) { e.stopPropagation(); dropdown.classList.toggle('open'); });
      document.addEventListener('click', function (e) { if (!wrapper.contains(e.target)) dropdown.classList.remove('open'); });

      async function loadNotifications() {
        try {
          var res = await fetch('/api/notifications');
          if (!res.ok) return;
          var data = await res.json();
          if (data.unreadCount > 0) { badge.textContent = data.unreadCount > 9 ? '9+' : data.unreadCount; badge.classList.add('show'); } else { badge.classList.remove('show'); }
          if (data.notifications.length === 0) { list.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }

          var icons = { follow: '👤', reply: '💬', mention: '@' };
          list.innerHTML = data.notifications.map(function(n) {
            var isUnread = !n.is_read;
            var actorName = n.actor_display_name || n.actor_username;
            var text = n.type === 'follow' ? '<strong>' + actorName + '</strong> followed you' : n.type === 'reply' ? '<strong>' + actorName + '</strong> replied to your comment' : '<strong>' + actorName + '</strong> mentioned you';
            var mins = Math.floor((Date.now() - new Date(n.created_at).getTime()) / 60000);
            var timeStr = mins < 60 ? mins + 'm ago' : Math.floor(mins/60) + 'h ago';

            return `<a href="${n.link}" class="notif-item ${isUnread ? 'unread' : ''}"><div class="notif-icon">${icons[n.type] || '🔔'}</div><div class="notif-text">${text}<span class="notif-time">${timeStr}</span></div></a>`;
          }).join('');
        } catch (err) {}
      }
      markReadBtn.addEventListener('click', async function() { await fetch('/api/notifications?action=read-all', { method: 'POST' }); loadNotifications(); });
      loadNotifications();
      setInterval(loadNotifications, 30000);
    } catch (err) {}
  })();

    window.uploadImage = async function(input, type) {
    if (!input.files || !input.files[0]) return;
    
    var file = input.files[0];
    var formData = new FormData();
    formData.append('file', file);
    formData.append('type', type);

    var btn = input.previousElementSibling;
    var originalText = btn.textContent;
    btn.textContent = 'Uploading...';
    btn.disabled = true;

    try {
      var res = await fetch('/api/upload', {
        method: 'POST',
        body: formData
      });
      var data = await res.json();
      
      if (!res.ok) throw new Error(data.error || 'Upload failed');

      var previewId = type === 'avatar' ? 'avatarPreview' : 'bannerPreview';
      document.getElementById(previewId).style.backgroundImage = `url('${data.url}')`;
      
      alert('Upload successful! Click "Save Changes" to apply.');
    } catch (err) {
      alert(err.message);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };
</script>
